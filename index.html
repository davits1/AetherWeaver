        if (State.chatMenuOpen && !e.target.closest('.chat-header-actions')) {
          State.chatMenuOpen = false;
          renderMainView();
        }
        return;
      }

      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'nav': {
          State.screen = btn.getAttribute('data-screen');
          State.chatMenuOpen = false;
          renderMainView();
          break;
        }

        case 'toggle-theme': {
          const s = Storage.getSettings();
          s.theme = s.theme === 'dark' ? 'light' : 'dark';
          Storage.saveSettings(s);
          renderMainView();
          break;
        }

        case 'select-cat': {
          State.selectedCategory = btn.getAttribute('data-cat');
          renderMainView();
          break;
        }

        case 'clear-search': {
          State.searchQuery = '';
          renderMainView();
          break;
        }

        case 'view-profile': {
          e.stopPropagation();
          State.activeCharacterId = btn.getAttribute('data-char-id');
          State.chatMenuOpen = false;
          State.screen = 'profile';
          renderMainView();
          break;
        }

        case 'start-or-open-char': {
          if (e.target.closest('[data-action="view-profile"]')) return;
          const charId = btn.getAttribute('data-char-id');
          const existingChats = Storage.getChats().filter(c => c.characterId === charId).sort((a, b) => b.updatedAt - a.updatedAt);
          const char = await API.getCharacter(charId);
          if (!char) return;
          const chat = existingChats[0] || createNewChatForCharacter(char);
          State.activeCharacterId = char.id;
          State.activeChatId = chat.id;
          State.screen = 'chat';
          State.visibleMessageLimit = 40;
          State.preserveScrollPosition = false;
          State.isLoadingOlder = false;
          State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
          renderMainView();
          break;
        }

        case 'new-chat-for-char': {
          const charId = btn.getAttribute('data-char-id');
          const char = await API.getCharacter(charId);
          if (!char) return;
          const chat = createNewChatForCharacter(char);
          State.activeCharacterId = char.id;
          State.activeChatId = chat.id;
          State.chatMenuOpen = false;
          State.screen = 'chat';
          State.visibleMessageLimit = 40;
          State.preserveScrollPosition = false;
          State.isLoadingOlder = false;
          State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
          renderMainView();
          break;
        }

        case 'open-chat': {
          if (e.target.closest('[data-action="rename-chat"], [data-action="delete-chat"]')) return;
          const chatId = btn.getAttribute('data-chat-id');
          const charId = btn.getAttribute('data-char-id');
          State.activeChatId = chatId;
          State.activeCharacterId = charId;
          State.chatMenuOpen = false;
          State.screen = 'chat';
          State.visibleMessageLimit = 40;
          State.preserveScrollPosition = false;
          State.isLoadingOlder = false;
          const char = await API.getCharacter(charId);
          const chat = getActiveChat();
          if (char && chat) {
            State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
          }
          renderMainView();
          break;
        }

        case 'create-char': {
          State.editorCharacterId = null;
          State.screen = 'editor';
          renderMainView();
          break;
        }

        case 'edit-char': {
          const charId = btn.getAttribute('data-char-id');
          if (isSeedCharacter(charId)) {
            // For seed characters, automatically clone into an editable custom copy
            const char = await API.getCharacter(charId);
            if (!char) return;
            const copyName = char.name.includes('(Copy)') ? char.name : `${char.name} (Copy)`;
            const copy = await API.saveCharacter({
              ...char,
              id: '',
              name: copyName,
              creator: '@you',
              chatCount: 0
            });
            showToast(`Created editable copy "${copy.name}".`, 'success');
            State.editorCharacterId = copy.id;
            State.screen = 'editor';
            renderMainView();
            break;
          }
          State.editorCharacterId = charId;
          State.screen = 'editor';
          renderMainView();
          break;
        }

        case 'duplicate-char': {
          e.stopPropagation();
          const charId = btn.getAttribute('data-char-id');
          const char = await API.getCharacter(charId);
          if (!char) return;
          const copyName = char.name.includes('(Copy)') ? char.name : `${char.name} (Copy)`;
          const copy = await API.saveCharacter({
            ...char,
            id: '',
            name: copyName,
            creator: '@you',
            chatCount: 0
          });
          showToast(`Cloned as "${copy.name}". Opening editor...`, 'success');
          State.editorCharacterId = copy.id;
          State.screen = 'editor';
          renderMainView();
          break;
        }

        case 'delete-char': {
          const charId = btn.getAttribute('data-char-id');
          if (isSeedCharacter(charId)) {
            showToast('Default characters cannot be deleted.', 'warning');
            return;
          }
          const char = await API.getCharacter(charId);
          if (!char) return;
          showConfirmDialog({
            title: 'Delete Character?',
            message: `Permanently delete "${char.name}" and all associated chats? This cannot be undone.`,
            confirmLabel: 'Delete Character',
            onConfirm() {
              Storage.saveCharacters(Storage.getCharacters().filter(c => c.id !== charId));
              Storage.saveChats(Storage.getChats().filter(c => c.characterId !== charId));
              showToast(`Deleted "${char.name}".`, 'info');
              State.screen = 'discover';
              renderMainView();
            }
          });
          break;
        }

        case 'export-char': {
          const char = await API.getCharacter(btn.getAttribute('data-char-id'));
          if (char) {
            downloadJsonFile(`${char.name.toLowerCase().replace(/[^a-z0-9]+/g, '_')}_character.json`, char);
          }
          break;
        }

        case 'import-char-json': {
          promptJsonImport(async (data) => {
            if (!data.name) throw new Error('Character JSON missing "name" field.');
            const saved = await API.saveCharacter({ ...data, id: '' });
            showToast(`Imported character "${saved.name}".`, 'success');
            State.editorCharacterId = saved.id;
            renderMainView();
          });
          break;
        }

        case 'toggle-chat-menu': {
          e.stopPropagation();
          State.chatMenuOpen = !State.chatMenuOpen;
          renderMainView();
          break;
        }

        case 'toggle-context-drawer': {
          State.contextDrawerOpen = !State.contextDrawerOpen;
          renderMainView();
          break;
        }

        case 'char-chat-history': {
          State.historyFilterCharId = btn.getAttribute('data-char-id');
          State.chatMenuOpen = false;
          State.screen = 'history';
          renderMainView();
          break;
        }

        case 'clear-history-filter': {
          State.historyFilterCharId = null;
          renderMainView();
          break;
        }

        case 'load-more-messages': {
          await loadOlderMessages();
          break;
        }

        case 'send-message': {
          handleSendUserMessage();
          break;
        }

        case 'stop-generation': {
          if (State.abortController) {
            State.abortController.abort();
          }
          break;
        }

        case 'use-suggestion': {
          const replyText = btn.getAttribute('data-text');
          State.suggestedReplies = [];
          handleSendUserMessage(replyText);
          break;
        }

        case 'refresh-suggestions': {
          const chat = getActiveChat();
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (chat && char) {
            btn.classList.add('spin');
            btn.disabled = true;
            showToast('Generando sugerencias de respuesta...', 'info');
            try {
              State.suggestedReplies = await API.suggestReplies({
                character: char,
                messages: chat.messages,
                useAi: true
              });
              const s = Storage.getSettings();
              s.showSuggestions = true;
              Storage.saveSettings(s);
              await renderMainView();
              showToast('Sugerencias actualizadas', 'success');
            } catch (err) {
              console.error('Error al actualizar sugerencias:', err);
              showToast('No se pudieron generar sugerencias', 'error');
            } finally {
              btn.classList.remove('spin');
              btn.disabled = false;
            }
          }
          break;
        }

        case 'composer-gen-image': {
          handleGenerateMessageImage(null);
          break;
        }

        case 'msg-gen-image':
        case 'regen-msg-image': {
          handleGenerateMessageImage(btn.getAttribute('data-msg-id'));
          break;
        }

        case 'download-msg-image': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const alt = msg?.alternatives[msg.selectedIndex];
          if (alt?.imageUrl) {
            const url = ImageStore.resolveUrl(alt.imageUrl);
            const isSvg = url.endsWith('.svg') || url.includes('image/svg');
            const ext = isSvg ? 'svg' : 'png';
            const a = document.createElement('a');
            a.href = url;
            a.download = `scene_${msg.id}.${ext}`;
            a.click();
          }
          break;
        }

        case 'use-image-as-avatar': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const alt = msg?.alternatives[msg.selectedIndex];
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (alt?.imageUrl && char) {
            char.avatar = alt.imageUrl;
            await API.saveCharacter(char);
            showToast(`Updated ${char.name}'s avatar!`, 'success');
            renderMainView();
          }
          break;
        }

        case 'swipe-prev': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          if (msg && msg.selectedIndex > 0) {
            msg.selectedIndex--;
            updateChatInStorage(chat);
            const container = document.getElementById('chat-messages');
            const savedTop = container ? container.scrollTop : 0;
            State.preserveScrollPosition = true;
            await renderMainView();
            State.preserveScrollPosition = false;
            const nextCont = document.getElementById('chat-messages');
            if (nextCont) nextCont.scrollTop = savedTop;
          }
          break;
        }

        case 'swipe-next': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          if (!chat || !msg) break;
          if (msg.selectedIndex < msg.alternatives.length - 1) {
            msg.selectedIndex++;
            updateChatInStorage(chat);
            const container = document.getElementById('chat-messages');
            const savedTop = container ? container.scrollTop : 0;
            State.preserveScrollPosition = true;
            await renderMainView();
            State.preserveScrollPosition = false;
            const nextCont = document.getElementById('chat-messages');
            if (nextCont) nextCont.scrollTop = savedTop;
          } else {
            // Generate a new swipe alternative
            const char = await API.getCharacter(chat.characterId);
            if (char) await triggerAssistantGeneration({ chat, char, targetMessage: msg });
          }
          break;
        }

        case 'regen-msg': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (chat && msg && char) {
            await triggerAssistantGeneration({ chat, char, targetMessage: msg });
          }
          break;
        }

        case 'continue-msg': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (chat && msg && char) {
            const currentText = msg.alternatives[msg.selectedIndex]?.text || '';
            await triggerAssistantGeneration({ chat, char, targetMessage: msg, continueText: currentText });
          }
          break;
        }

        case 'copy-msg': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const text = msg?.alternatives[msg.selectedIndex]?.text || '';
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
          }
          showToast('Message copied to clipboard.', 'success');
          break;
        }

        case 'edit-msg': {
          State.editingMessageId = btn.getAttribute('data-msg-id');
          const container = document.getElementById('chat-messages');
          const savedTop = container ? container.scrollTop : 0;
          State.preserveScrollPosition = true;
          await renderMainView();
          State.preserveScrollPosition = false;
          const nextCont = document.getElementById('chat-messages');
          if (nextCont) nextCont.scrollTop = savedTop;
          break;
        }

        case 'cancel-edit-msg': {
          State.editingMessageId = null;
          const container = document.getElementById('chat-messages');
          const savedTop = container ? container.scrollTop : 0;
          State.preserveScrollPosition = true;
          await renderMainView();
          State.preserveScrollPosition = false;
          const nextCont = document.getElementById('chat-messages');
          if (nextCont) nextCont.scrollTop = savedTop;
          break;
        }

        case 'save-edit-msg': {
          const msgId = btn.getAttribute('data-msg-id');
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === msgId);
          const textarea = document.querySelector(`.msg-row[data-msg-id="${msgId}"] .edit-msg-textarea`);
          if (chat && msg && textarea) {
            msg.alternatives[msg.selectedIndex].text = textarea.value;
            State.editingMessageId = null;
            updateChatInStorage(chat);
            const container = document.getElementById('chat-messages');
            const savedTop = container ? container.scrollTop : 0;
            State.preserveScrollPosition = true;
            await renderMainView();
            State.preserveScrollPosition = false;
            const nextCont = document.getElementById('chat-messages');
            if (nextCont) nextCont.scrollTop = savedTop;
          }
          break;
        }

        case 'rewind-msg': {
          const msgId = btn.getAttribute('data-msg-id');
          const chat = getActiveChat();
          if (!chat) break;
          const idx = chat.messages.findIndex(m => m.id === msgId);
          if (idx < 0 || idx === chat.messages.length - 1) {
            showToast('Already at this point in the conversation.', 'info');
            break;
          }
          showConfirmDialog({
            title: 'Rewind Conversation?',
            message: `Delete ${chat.messages.length - 1 - idx} subsequent message(s) after this point?`,
            confirmLabel: 'Rewind Here',
            onConfirm() {
              chat.messages = chat.messages.slice(0, idx + 1);
              updateChatInStorage(chat);
              renderMainView();
            }
          });
          break;
        }

        case 'delete-msg': {
          const msgId = btn.getAttribute('data-msg-id');
          const chat = getActiveChat();
          if (!chat) break;
          showConfirmDialog({
            title: 'Delete Message?',
            message: 'Remove this message from the chat history?',
            confirmLabel: 'Delete',
            onConfirm() {
              chat.messages = chat.messages.filter(m => m.id !== msgId);
              updateChatInStorage(chat);
              renderMainView();
            }
          });
          break;
        }

        case 'clear-chat': {
          State.chatMenuOpen = false;
          const chat = getActiveChat();
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (!chat || !char) break;
          showConfirmDialog({
            title: 'Clear Current Chat?',
            message: `Reset this conversation back to ${char.name}'s opening greeting?`,
            confirmLabel: 'Clear Chat',
            onConfirm() {
              chat.messages = [{
                id: 'msg_' + Date.now(),
                role: 'char',
                selectedIndex: 0,
                alternatives: [{ text: char.greeting, createdAt: Date.now() }]
              }];
              State.visibleMessageLimit = 40;
              State.preserveScrollPosition = false;
              State.isLoadingOlder = false;
              updateChatInStorage(chat);
              renderMainView();
            }
          });
          break;
        }

        case 'export-chat': {
          State.chatMenuOpen = false;
          const chat = getActiveChat();
          if (chat) {
            downloadJsonFile(`${chat.title.toLowerCase().replace(/[^a-z0-9]+/g, '_')}.json`, chat);
          }
          break;
        }

        case 'import-chat': {
          State.chatMenuOpen = false;
          promptJsonImport((data) => {
            if (!Array.isArray(data.messages)) throw new Error('Invalid chat JSON.');
            const current = getActiveChat();
            const imported = {
              ...data,
              id: 'chat_' + Date.now(),
              characterId: current ? current.characterId : data.characterId,
              updatedAt: Date.now()
            };
            updateChatInStorage(imported);
            State.activeChatId = imported.id;
            showToast('Imported chat session.', 'success');
            renderMainView();
          });
          break;
        }

        case 'add-lore-entry': {
          const chat = getActiveChat();
          if (!chat) break;
          chat.lorebook = chat.lorebook || [];
          chat.lorebook.unshift({
            id: 'lore_' + Date.now(),
            name: 'New Lore Entry',
            keywords: ['keyword'],
            text: '',
            enabled: true
          });
          updateChatInStorage(chat);
          renderMainView();
          break;
        }

        case 'delete-lore-entry': {
          const loreId = btn.getAttribute('data-lore-id');
          const chat = getActiveChat();
          if (!chat) break;
          chat.lorebook = (chat.lorebook || []).filter(l => l.id !== loreId);
          updateChatInStorage(chat);
          renderMainView();
          break;
        }

        case 'rename-chat': {
          e.stopPropagation();
          const chatId = btn.getAttribute('data-chat-id');
          const chats = Storage.getChats();
          const chat = chats.find(c => c.id === chatId);
          if (!chat) break;
          const nextTitle = prompt('Rename chat session:', chat.title);
          if (nextTitle && nextTitle.trim()) {
            chat.title = nextTitle.trim();
            Storage.saveChats(chats);
            renderMainView();
          }
          break;
        }

        case 'delete-chat': {
          e.stopPropagation();
          const chatId = btn.getAttribute('data-chat-id');
          showConfirmDialog({
            title: 'Delete Chat Session?',
            message: 'Permanently delete this conversation history?',
            confirmLabel: 'Delete',
            onConfirm() {
              Storage.saveChats(Storage.getChats().filter(c => c.id !== chatId));
              if (State.activeChatId === chatId) State.activeChatId = null;
              renderMainView();
            }
          });
          break;
        }

        case 'add-persona': {
          const personas = Storage.getPersonas();
          const next = {
            id: 'persona_' + Date.now(),
            name: 'New Persona',
            description: 'Describe your character appearance and demeanor...',
            avatar: makeSvgAvatar('NP', '#7c3aed', '#db2777')
          };
          personas.push(next);
          Storage.savePersonas(personas);
          Storage.setActivePersonaId(next.id);
          renderMainView();
          break;
        }

        case 'activate-persona': {
          Storage.setActivePersonaId(btn.getAttribute('data-persona-id'));
          showToast('Switched active persona.', 'success');
          renderMainView();
          break;
        }

        case 'save-persona': {
          const pId = btn.getAttribute('data-persona-id');
          const card = document.querySelector(`[data-persona-id="${pId}"]`);
          const personas = Storage.getPersonas();
          const p = personas.find(x => x.id === pId);
          if (card && p) {
            p.name = card.querySelector('.persona-name-input').value.trim() || 'Traveler';
            p.description = card.querySelector('.persona-desc-input').value.trim();
            Storage.savePersonas(personas);
            showToast(`Saved persona "${p.name}".`, 'success');
            renderMainView();
          }
          break;
        }

        case 'regen-persona-avatar': {
          const pId = btn.getAttribute('data-persona-id');
          const personas = Storage.getPersonas();
          const p = personas.find(x => x.id === pId);
          if (p) {
            p.avatar = await API.generateAvatar({ character: { name: p.name } });
            Storage.savePersonas(personas);
            renderMainView();
          }
          break;
        }

        case 'delete-persona': {
          const pId = btn.getAttribute('data-persona-id');
          showConfirmDialog({
            title: 'Delete Persona?',
            message: 'Remove this persona profile?',
            confirmLabel: 'Delete',
            onConfirm() {
              const remaining = Storage.getPersonas().filter(x => x.id !== pId);
              Storage.savePersonas(remaining);
              if (Storage.getActivePersonaId() === pId && remaining[0]) {
                Storage.setActivePersonaId(remaining[0].id);
              }
              renderMainView();
            }
          });
          break;
        }

        case 'export-all-data': {
          const data = await Storage.exportAllData();
          downloadJsonFile(`aetherweaver_backup_${new Date().toISOString().slice(0, 10)}.json`, data);
          showToast('Exported full backup JSON.', 'success');
          break;
        }

        case 'import-all-data': {
          promptJsonImport(async (payload) => {
            await Storage.importAllData(payload);
            showToast('Backup restored!', 'success');
            renderMainView();
          });
          break;
        }

        case 'reset-demo-data': {
          showConfirmDialog({
            title: 'Reset All Data to Demo State?',
            message: 'This will erase all custom characters, chats, personas, and settings and restore the factory seed data.',
            confirmLabel: 'Reset Everything',
            onConfirm() {
              Storage.resetToDemo();
              State.activeChatId = null;
              State.activeCharacterId = null;
              State.screen = 'discover';
              showToast('Reset to factory demo data.', 'info');
              renderMainView();
            }
          });
          break;
        }
      }
    });

    /* Global Keyboard Shortcuts (Desktop) */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modalRoot = document.getElementById('modal-root');
        if (modalRoot && modalRoot.innerHTML !== '') {
          modalRoot.innerHTML = '';
          return;
        }
        if (State.isGenerating && State.abortController) {
          State.abortController.abort();
          return;
        }
        if (State.chatMenuOpen) {
          State.chatMenuOpen = false;
          renderMainView();
        }
      }

      // Press '/' on Discover screen to focus search
      if (e.key === '/' && State.screen === 'discover' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        const searchEl = document.getElementById('discover-search-input');
        if (searchEl) searchEl.focus();
      }
    });

    /**
     * ============================================================================
     * 8. INITIALIZATION & SERVICE WORKER REGISTRATION
     * ============================================================================
     */
    async function initApp() {
      // 1. Initialize IndexedDB store for images
      await ImageStore.init();

      // 2. Clear stuck loading flags and migrate legacy base64 images to IndexedDB
      await ImageStore.migrateLocalStorage();

      // 3. Ensure seed characters & personas are initialized in localStorage on first run
      const chars = Storage.getCharacters();
      const personas = Storage.getPersonas();
      const chats = Storage.getChats();
      Storage.getSettings();

      // 4. Preload all idb image blobs into memory cache for instantaneous sync rendering
      await ImageStore.preloadAll(chats, chars, personas);

      // 5. Render main view
      await renderMainView();

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Silent ignore if served from file:// or restricted preview iframe
        });
      }
    }

    initApp();
  </script>
</body>
</html>
