            return { width: 1216, height: 832 };
          case 'square':
            return { width: 1024, height: 1024 };
          case 'portrait':
          default:
            return { width: 832, height: 1216 };
        }
      },

      buildPayload({ prompt, character, settings, isAvatar = false, globalPrompt = null, characterPrompt = null }) {
        const imgSettings = settings?.imageGen || {};
        const preset = isAvatar ? 'square' : (imgSettings.sizePreset || 'portrait');
        const { width, height } = this.getResolution(preset);

        let basePrompt = '';
        const characterPrompts = [];

        if (globalPrompt && characterPrompt) {
          basePrompt = globalPrompt;
          characterPrompts.push({
            prompt: characterPrompt,
            uc: '',
            center: { x: 0, y: 0 },
            enabled: true
          });
        } else {
          const stylePrefix = isAvatar
            ? (imgSettings.stylePrefix || 'masterpiece, best quality, character avatar portrait, clean background')
            : (imgSettings.stylePrefix || 'depthness, high complexity, cinematic lighting');

          basePrompt = prompt.includes(stylePrefix)
            ? [prompt, 'no text'].filter(Boolean).join(', ')
            : [stylePrefix, prompt, 'no text'].filter(Boolean).join(', ');

          if (character && character.name) {
            const charParts = [
              character.name,
              character.tagline,
              character.description
            ].filter(Boolean);

            if (charParts.length > 0) {
              characterPrompts.push({
                prompt: charParts.join(', '),
                uc: '',
                center: { x: 0, y: 0 },
                enabled: true
              });
            }
          }
        }

        const negativePrompt = imgSettings.negativePrompt ||
          'lowres, artistic error, film grain, scan artifacts, worst quality, bad quality, jpeg artifacts, very displeasing, chromatic aberration, dithering, halftone, screentone, multiple views, logo, too many watermarks, negative space, blank page, bad anatomy';

        const steps = Number(imgSettings.steps) || this.DEFAULT_STEPS;
        const scale = Number(imgSettings.guidance) || this.DEFAULT_SCALE;
        const sampler = imgSettings.sampler || this.DEFAULT_SAMPLER;
        const seed = (imgSettings.seed && Number(imgSettings.seed) > 0)
          ? Number(imgSettings.seed)
          : Math.floor(Math.random() * 4294967295);

        return {
          model: this.MODEL,
          action: 'generate',
          input: basePrompt,
          parameters: {
            params_version: 4,
            width,
            height,
            steps,
            scale,
            sampler,
            seed,
            n_samples: 1,
            noise_schedule: 'karras',
            qualityToggle: false,
            characterPrompts,
            negative_prompt: negativePrompt,
            v4_prompt: {
              caption: {
                base_caption: basePrompt,
                char_captions: characterPrompts.map(cp => ({
                  char_caption: cp.prompt,
                  centers: [{ x: 0, y: 0 }]
                }))
              },
              use_coords: false,
              use_order: true
            },
            v4_negative_prompt: {
              caption: {
                base_caption: negativePrompt,
                char_captions: []
              },
              use_coords: false,
              use_order: false
            }
          }
        };
      },

      async extractPngBytes(arrayBuffer) {
        const bytes = new Uint8Array(arrayBuffer);
        // Case 1: Raw PNG (magic bytes: 89 50 4E 47)
        if (bytes.length >= 8 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47) {
          return bytes;
        }
        // Case 2: JSON text with base64 image
        try {
          const text = new TextDecoder().decode(bytes);
          if (text.trim().startsWith('{')) {
            const data = JSON.parse(text);
            const b64 = data.images?.[0]?.image || data.image;
            if (b64) {
              const bin = atob(b64);
              const out = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
              return out;
            }
          }
        } catch (e) {}
        // Case 3: ZIP archive (magic bytes: 50 4B 03 04)
        if (bytes.length >= 30 && bytes[0] === 0x50 && bytes[1] === 0x4B && bytes[2] === 0x03 && bytes[3] === 0x04) {
          const view = new DataView(arrayBuffer);
          const method = view.getUint16(8, true);
          let compSize = view.getUint32(18, true);
          const nameLen = view.getUint16(26, true);
          const extraLen = view.getUint16(28, true);
          const dataStart = 30 + nameLen + extraLen;
          if (compSize === 0) {
            for (let i = dataStart; i < bytes.length - 4; i++) {
              if (bytes[i] === 0x50 && bytes[i + 1] === 0x4B && (bytes[i + 2] === 0x01 || bytes[i + 2] === 0x05 || bytes[i + 2] === 0x07)) {
                compSize = i - dataStart;
                break;
              }
            }
            if (compSize === 0) compSize = bytes.length - dataStart;
          }
          const slice = bytes.subarray(dataStart, dataStart + compSize);
          if (method === 0) {
            return slice;
          } else if (method === 8) {
            if (typeof DecompressionStream !== 'undefined') {
              const ds = new DecompressionStream('deflate-raw');
              const writer = ds.writable.getWriter();
              writer.write(slice);
              writer.close();
              const reader = ds.readable.getReader();
              const chunks = [];
              let total = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                total += value.length;
              }
              const res = new Uint8Array(total);
              let offset = 0;
              for (const c of chunks) {
                res.set(c, offset);
                offset += c.length;
              }
              return res;
            }
          }
          return slice;
        }
        return bytes;
      },

      bytesToDataUrl(bytes) {
        let binary = '';
        const len = bytes.byteLength;
        const chunkSize = 32768;
        for (let i = 0; i < len; i += chunkSize) {
          const end = Math.min(i + chunkSize, len);
          binary += String.fromCharCode.apply(null, bytes.subarray(i, end));
        }
        return 'data:image/png;base64,' + btoa(binary);
      },

      async generate({ prompt, character, settings, signal, isAvatar = false, globalPrompt = null, characterPrompt = null }) {
        const payload = this.buildPayload({ prompt, character, settings, isAvatar, globalPrompt, characterPrompt });
        const prov = settings?.provider || {};
        const tokenOverride = (prov.apiKey || '').trim();
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const rawProxy = String(prov.proxyBase || '').trim().replace(/\/+$/, '');
        const isDirect = !rawProxy || (!isLocal && (rawProxy === '/proxy' || rawProxy === 'direct'));

        const headers = {
          'Content-Type': 'application/json',
          'Accept': isDirect ? 'application/x-zip-compressed, application/json, */*' : 'application/json'
        };
        if (tokenOverride) {
          headers['Authorization'] = `Bearer ${tokenOverride.replace(/^Bearer\s+/i, '')}`;
        } else if (isDirect) {
          throw new Error('NovelAI API token is required for image generation. Por favor escribe tu API Token en Ajustes.');
        }

        const targetUrl = isDirect
          ? 'https://image.novelai.net/ai/generate-image'
          : `${rawProxy || '/proxy'}/image/ai/generate-image`;

        const abortCtrl = new AbortController();
        const timeoutId = setTimeout(() => {
          abortCtrl.abort(new Error('Image generation timed out after 60 seconds'));
        }, 60000);
        if (signal) {
          signal.addEventListener('abort', () => abortCtrl.abort(signal.reason), { once: true });
        }

        let res;
        try {
          res = await fetch(targetUrl, {
            method: 'POST',
            headers,
            body: JSON.stringify(payload),
            signal: abortCtrl.signal
          });
        } finally {
          clearTimeout(timeoutId);
        }

        if (!res.ok) {
          let errMsg = `Image generation failed (${res.status})`;
          try {
            const errData = await res.json();
            errMsg = errData.message || errData.error || errMsg;
          } catch {}
          throw new Error(errMsg);
        }

        if (isDirect) {
          const buf = await res.arrayBuffer();
          const pngBytes = await this.extractPngBytes(buf);
          const blob = new Blob([pngBytes], { type: 'image/png' });
          const key = (isAvatar ? 'avatar_' : 'scene_') + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          await ImageStore.save(key, blob);
          return 'idb:' + key;
        }

        const data = await res.json();
        if (!data || !data.url) {
          throw new Error('NovelAI proxy did not return an image URL.');
        }
        return data.url;
      }
    };
    /* NAI-IMAGE:END */

    const API = {
      /**
       * Lists characters filtered by search query and category tag.
       * @param {string} [query=""]
       * @param {string} [category="All"]
       * @returns {Promise<Character[]>}
       */
      async listCharacters(query = '', category = 'All') {
        await new Promise(r => setTimeout(r, 80));
        const all = Storage.getCharacters();
        const q = query.trim().toLowerCase();
        return all.filter(c => {
          const matchesCat = !category || category === 'All' || (c.tags && c.tags.includes(category));
          const matchesQuery = !q ||
            c.name.toLowerCase().includes(q) ||
            c.tagline.toLowerCase().includes(q) ||
            c.description.toLowerCase().includes(q) ||
            (c.tags && c.tags.some(t => t.toLowerCase().includes(q)));
          return matchesCat && matchesQuery;
        });
      },

      /**
       * Retrieves a single character by ID.
       * @param {string} id
       * @returns {Promise<Character|null>}
       */
      async getCharacter(id) {
        await new Promise(r => setTimeout(r, 40));
        return Storage.getCharacters().find(c => c.id === id) || null;
      },

      /**
       * Creates or updates a character in persistent storage.
       * @param {Character} character
       * @returns {Promise<Character>}
       */
      async saveCharacter(character) {
        await new Promise(r => setTimeout(r, 120));
        const chars = Storage.getCharacters();
        const now = Date.now();
        const isSeed = typeof isSeedCharacter === 'function' && isSeedCharacter(character.id);
        const saved = {
          ...character,
          id: (!character.id || isSeed) ? ('char_' + now + '_' + Math.random().toString(36).slice(2, 6)) : character.id,
          creator: isSeed ? '@you' : (character.creator || '@you'),
          isCustom: true,
          updatedAt: now,
          chatCount: typeof character.chatCount === 'number' ? character.chatCount : 1
        };
        const idx = chars.findIndex(c => c.id === saved.id);
        if (idx >= 0) chars[idx] = saved;
        else chars.unshift(saved);
        Storage.saveCharacters(chars);
        return saved;
      },

      /**
       * Generates a streaming character reply (or continuation).
       * Respects `signal` (AbortSignal) for immediate cancellation and invokes `onToken(chunk)`.
       *
       * @param {Object} params
       * @param {Character} params.character
       * @param {Persona} params.persona
       * @param {Message[]} params.messages
       * @param {string} params.memory
       * @param {string} params.authorsNote
       * @param {LorebookEntry[]} params.lorebookEntries
       * @param {Settings} params.settings
       * @param {AbortSignal} [params.signal]
       * @param {function(string): void} [params.onToken]
       * @param {string} [params.continueFrom] - Optional partial string when user clicks "Continue"
       * @returns {Promise<string>} Complete generated text
       */
      async generateReply({
        character,
        persona,
        messages,
        memory,
        authorsNote,
        lorebookEntries,
        settings,
        signal,
        onToken,
        continueFrom = ''
      }) {
        if (signal && signal.aborted) {
          throw new DOMException('Generation aborted', 'AbortError');
        }

        if (settings && settings.provider && settings.provider.type === 'novelai') {
          return NovelAIText.generate({
            character, persona, messages, memory, authorsNote, lorebookEntries, settings, signal, onToken, continueFrom
          });
        }

        // Find last user message to make mock response context-aware
        const lastUserMsg = [...messages].reverse().find(m => m.role === 'user');
        const userText = lastUserMsg
          ? (lastUserMsg.alternatives[lastUserMsg.selectedIndex]?.text || '')
          : '';

        // Check if any enabled lorebook entry keyword is triggered in recent text
        const activeLore = (lorebookEntries || []).filter(e =>
          e.enabled && e.keywords.some(k => k && userText.toLowerCase().includes(k.toLowerCase()))
        );

        const personaName = persona?.name || 'Traveler';
        let mockReply = '';

        if (continueFrom) {
          const continuations = [
            ` *${character.name} pauses for a heartbeat, eyes narrowing as the silence stretches between them.* "There's more to it than what's written on the surface, ${personaName}. Tell me what you're really thinking before we take the next step."`,
            ` *A faint smile tugs at the corner of ${character.name}'s lips before turning back toward the horizon.* "If we're committing to this course, there's no turning back now."`,
            ` *The ambient hum in the room seems to sharpen for a brief second.* "Actually—wait. Did you hear that just now, or is my paranoia finally catching up with me?"`
          ];
          mockReply = continuations[Math.floor(Math.random() * continuations.length)];
        } else {
          const snippets = [
            `*${character.name} regards ${personaName} with a measured, unhurried gaze, taking in every word.* "${userText ? 'You mention ' + userText.slice(0, 42).replace(/[*"]/g, '').trim() + '...' : 'So, we finally have a moment to speak.'} That changes our calculus considerably." *A subtle shift in posture betrays heightened attention.* "How do you propose we handle the fallout?"`,
            `*Leaning against the nearest surface, ${character.name} lets out a quiet, dry chuckle.* "Bold way to put it, ${personaName}." *Fingers tap a slow rhythm while weighing the options.* "I've seen plenty of people try the direct approach, and only a handful walked away with what they wanted. Let's see if you're one of them."`,
            `*${character.name}'s expression softens just a fraction, though the sharp intensity in their eyes remains.* "Right then, ${personaName}. Let's strip away the pleasantries and get straight to the core of it." *They step closer, lowering their voice.* "What's your next move?"`
          ];
          mockReply = snippets[Math.floor(Math.random() * snippets.length)];

          if (activeLore.length > 0) {
            mockReply += `\n\n*A flicker of recognition crosses ${character.name}'s face regarding ${activeLore[0].name}.* "And considering what we know about ${activeLore[0].keywords[0]}—we'd better tread carefully."`;
          }
          if (authorsNote && authorsNote.trim().length > 0) {
            mockReply += ` *The atmosphere carries the distinct undertone of ${authorsNote.trim().slice(0, 45)}.*`;
          }
        }

        // Adjust verbosity by settings.responseLength
        if (settings?.responseLength === 'short' && !continueFrom) {
          mockReply = mockReply.split('\n\n')[0];
        } else if (settings?.responseLength === 'long' && !continueFrom) {
          mockReply += `\n\n*${character.name} glances around once more, ensuring no one else is within earshot, before gesturing toward the table.* "Take your time answering. Every detail counts from here on out."`;
        }

        // Tokenize and stream
        const tokens = mockReply.match(/\S+\s*/g) || [mockReply];
        let accumulated = continueFrom ? continueFrom : '';

        for (const token of tokens) {
          if (signal && signal.aborted) {
            throw new DOMException('Generation aborted', 'AbortError');
          }
          await new Promise((resolve, reject) => {
            const timer = setTimeout(resolve, 28 + Math.random() * 25);
            if (signal) {
              signal.addEventListener('abort', () => {
                clearTimeout(timer);
                reject(new DOMException('Generation aborted', 'AbortError'));
              }, { once: true });
            }
          });
          accumulated += token;
          if (typeof onToken === 'function') {
            onToken(token);
          }
        }

        return accumulated;
      },

      /**

      async generateAvatar({ character, signal }) {

        const name = (character?.name || 'AI').trim();

        const palette = [
          ['#6d28d9', '#2563eb'],

      /**
       * Suggests 3 short quick-reply options based on current conversation context.
       * @param {Object} params
       * @param {Character} params.character
       * @param {Message[]} params.messages

       */
      async suggestReplies({ character, messages, useAi = false }) {
        const cname = character?.name || 'them';

        // Extract last few messages for context and language detection
        const recentMsgs = (messages || []).slice(-4);
        const combinedRecent = recentMsgs.map(m => m.alternatives?.[m.selectedIndex]?.text || '').join(' ');
        const isSpanish = /[áéíóúñ¿¡]|\b(?:hola|qué|cómo|estás|por qué|gracias|bueno|bien|vamos|está|tregua|señor|dime|acuerdo|entendido|claro|espera)\b/i.test(combinedRecent || character?.description || '');

        // Heuristic fallback pools (contextual and natural)
        const getFallbackSuggestions = () => {
          if (isSpanish) {
            const pools = [
              [
                `*Observa a ${cname} con atención.* "¿Qué es lo que realmente estás pensando?"`,
                `*Asiente despacio con una leve sonrisa.* "De acuerdo. ¿Cuál es nuestro siguiente movimiento?"`,
                `*Da un paso al frente con calma.* "No esperarás que acepte tan fácilmente, ¿verdad?"`
              ],
              [
                `*Cruza los brazos y arquea una ceja.* "Explícamelo otra vez, pero con calma."`,
                `*Sonríe con complicidad.* "Tienes toda mi atención. Continúa."`,
                `*Suspira y mantiene la mirada.* "Quizás tengas razón... pero no será sencillo."`
              ],
              [
                `*Se acerca un poco más a ${cname}.* "Dime la verdad, sin rodeos."`,
                `"Entendido. Si ese es el camino, cuenta conmigo."`,
                `*Muestra una sonrisa desafiante.* "¿Acaso me estás poniendo a prueba?"`
              ]
            ];
            return pools[Math.floor(Math.random() * pools.length)];
          } else {
            const pools = [
              [
                `*Look closely at ${cname} and ask what they're hiding.* "Tell me the whole truth."`,
                `"Fair enough. What's our next step from here?"`,
                `*Offer a wry smile and lean back.* "You don't expect me to agree that easily, do you?"`
              ],
              [
                `*Cross arms with a curious grin.* "Explain that to me one more time."`,
                `*Nod thoughtfully.* "You have my full attention. Go on."`,
                `*Take a step closer.* "Are you testing me, or do you genuinely mean that?"`
              ],
              [
                `*Sigh softly and maintain eye contact.* "Maybe you're right, but it won't be easy."`,
                `"Understood. If that's the plan, count me in."`,
                `*Raise an eyebrow.* "Don't tell me you were expecting me to say yes that fast."`
              ]
            ];
            return pools[Math.floor(Math.random() * pools.length)];
          }
        };

        // If useAi is false, return high-quality heuristic suggestions instantly
        if (!useAi) {
          return getFallbackSuggestions();
        }

        // AI Generation requested (e.g. from refresh-suggestions button)
        let settings = null;
        try { settings = Storage.getSettings(); } catch (e) { /* ignore */ }
        const prov = settings?.provider || {};

        if (prov.type === 'novelai') {
          const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          const rawProxy = String(prov.proxyBase || '').trim().replace(/\/+$/, '');
          const isDirect = !rawProxy || (!isLocal && (rawProxy === '/proxy' || rawProxy === 'direct'));

          const targetUrl = isDirect
            ? 'https://text.novelai.net/oa/v1/completions'
            : `${rawProxy || '/proxy'}/text/oa/v1/completions`;

          const headers = { 'Content-Type': 'application/json' };
          const tokenOverride = String(prov.apiKey || '').trim();
          if (tokenOverride && !/^https?:\/\//i.test(tokenOverride)) {
            headers['Authorization'] = `Bearer ${tokenOverride.replace(/^Bearer\s+/i, '')}`;
          } else if (isDirect) {
            return getFallbackSuggestions();
          }

          const persona = typeof getActivePersona === 'function' ? getActivePersona() : null;
          const userLabel = persona?.name || 'User';

          const contextLines = recentMsgs.map(m => {
            const role = m.role === 'user' ? userLabel : cname;
            const t = (m.alternatives?.[m.selectedIndex]?.text || '').trim();
            return `${role}: ${t}`;
          }).join('\n');

          const langInstruction = isSpanish
            ? 'Las opciones DEBEN estar en español.'
            : 'Match the language of the conversation.';

          const prompt = [
            'You are an AI roleplay assistant for an interactive visual novel.',
            `The user is playing as "${userLabel}" interacting with "${cname}".`,
            'Given the character profile and recent dialogue, generate exactly 3 concise, distinct roleplay reply options for what the user could say or do next.',
            langInstruction,
            'Each option must be 1 short sentence combining actions in *asterisks* and dialogue in quotes.',
            'Format strictly as:',

            '2. <option 2>',
            '3. <option 3>',
            '',
            `Character: ${cname}`,
            character?.tagline ? `Tagline: ${character.tagline}` : '',
            'Recent dialogue:',
            contextLines || `${cname}: (waits for your response)`,
            '',
            'Replies:',

        }
        if (Array.isArray(payload.characters)) this.saveCharacters(payload.characters);
        if (Array.isArray(payload.chats)) this.saveChats(payload.chats);
        if (Array.isArray(payload.personas)) this.savePersonas(payload.personas);
        if (payload.activePersonaId) this.setActivePersonaId(payload.activePersonaId);
        if (payload.settings) this.saveSettings(payload.settings);
        await ImageStore.preloadAll(this.getChats(), this.getCharacters(), this.getPersonas());

      if (!State.activeChatId) return null;
      return Storage.getChats().find(c => c.id === State.activeChatId) || null;

    function updateChatInStorage(updatedChat) {
      const chats = Storage.getChats();
      const idx = chats.findIndex(c => c.id === updatedChat.id);
      updatedChat.updatedAt = Date.now();
      if (idx >= 0) chats[idx] = updatedChat;
      else chats.unshift(updatedChat);
      Storage.saveChats(chats);
    }

            ]

        ],
        memory: `Character: ${character.name} (${character.tagline})`,
        authorsNote: 'Maintain character voice, grounded sensory detail, and roleplay formatting with *actions* and "dialogue".',
        lorebook: [

            text: character.description.slice(0, 260),
            enabled: true
          }
        ],
        updatedAt: Date.now()

      updateChatInStorage(chat);

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Roleplay & Basic Markdown Formatter:
     * - Code blocks ```...``` and inline `...`
     * - **bold**
     * - *italic action text* -> <em class="rp-action">
     * - "quoted speech" -> <span class="rp-quote">
     */
    function formatRoleplayText(raw) {
      if (!raw) return '';
      let safe = escapeHtml(raw);

      // Fenced code blocks
      safe = safe.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
      // Inline code
      safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      // Bold **text**
      safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Roleplay *action* (between single asterisks)
      safe = safe.replace(/\*([^*\n]+)\*/g, '<em class="rp-action">*$1*</em>');
      // Roleplay "dialogue"
      safe = safe.replace(/&quot;([^&]+?)&quot;/g, '<span class="rp-quote">&quot;$1&quot;</span>');

      // Paragraphs
      return safe
        .split(/\n{2,}/)
        .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    function formatCount(num) {
      if (!num) return '0';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    function showToast(message, type = 'info', retryCallback = null) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <div style="display:flex; gap:0.4rem; align-items:center;">
          ${retryCallback ? `<button class="mini-btn toast-retry-btn">Retry</button>` : ''}
          <button class="icon-btn toast-close-btn" style="width:32px;height:32px;" aria-label="Dismiss notification">${Icons.close}</button>
        </div>
      `;
      container.appendChild(toast);

      const remove = () => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      };

      toast.querySelector('.toast-close-btn').addEventListener('click', remove);
      if (retryCallback) {
        toast.querySelector('.toast-retry-btn').addEventListener('click', () => {
          remove();
          retryCallback();
        });
      }
      setTimeout(remove, 5000);
    }

    function renderMessageRow(msg, mIdx, totalMsgs, char, persona) {
      const isUser = msg.role === 'user';
      const senderName = isUser ? persona.name : char.name;
      const senderAvatar = isUser ? persona.avatar : char.avatar;
      const altIndex = Math.min(msg.selectedIndex || 0, msg.alternatives.length - 1);
      const activeAlt = msg.alternatives[altIndex] || { text: '' };
      const isEditing = State.editingMessageId === msg.id;
      const isLastCharMsg = !isUser && mIdx === totalMsgs - 1;

      return `
        <div class="msg-row ${isUser ? 'user' : 'char'}" data-msg-id="${escapeHtml(msg.id)}">
          <img class="msg-avatar" src="${ImageStore.resolveUrl(senderAvatar)}" ${senderAvatar?.startsWith('idb:') ? `data-idb-key="${escapeHtml(senderAvatar.slice(4))}"` : ''} alt="${escapeHtml(senderName)}">
          <div class="msg-content-wrap">
            <div class="msg-sender-line">
              <span class="msg-sender-name">${escapeHtml(senderName)}</span>
            </div>

            <div class="msg-bubble">
              ${isEditing ? `
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                  <textarea class="textarea-field edit-msg-textarea" style="min-height:95px;">${escapeHtml(activeAlt.text)}</textarea>
                  <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
                    <button class="mini-btn" data-action="cancel-edit-msg">Cancel</button>
                    <button class="mini-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);" data-action="save-edit-msg" data-msg-id="${escapeHtml(msg.id)}">Save</button>
                  </div>
                </div>
              ` : `
                <div class="msg-text-body">${activeAlt.text ? formatRoleplayText(activeAlt.text) : (State.isGenerating && isLastCharMsg ? `<div class="typing-dots"><span></span><span></span><span></span></div>` : '')}</div>
              `}

              ${activeAlt.imageLoading ? `
                <div class="msg-image-card">
                  <div class="skeleton-box" style="display:flex; align-items:center; justify-content:center; gap:0.6rem; padding:1.2rem; font-size:0.88rem; text-align:center;">
                    <div class="loading-spinner" style="display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.2); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0;"></div>
                    <span>${escapeHtml(activeAlt.imageLoadingStatus || 'Generating visual scene...')}</span>
                  </div>
                </div>
              ` : ''}

              ${activeAlt.imageUrl && !activeAlt.imageLoading ? `
                <div class="msg-image-card">
                  <img src="${ImageStore.resolveUrl(activeAlt.imageUrl)}" ${activeAlt.imageUrl.startsWith('idb:') ? `data-idb-key="${escapeHtml(activeAlt.imageUrl.slice(4))}"` : ''} alt="${escapeHtml(activeAlt.imagePrompt || 'Generated scene')}">
                  <div class="msg-image-meta">
                    <div style="font-size:0.8rem; line-height:1.35; color:var(--text-muted); word-break:break-word;"><strong>Prompt:</strong> ${escapeHtml(activeAlt.imagePrompt || 'Scene illustration')}</div>
                    <div class="msg-image-actions">
                      <button class="mini-btn" data-action="regen-msg-image" data-msg-id="${escapeHtml(msg.id)}">${Icons.refresh} Regenerate</button>
                      <button class="mini-btn" data-action="download-msg-image" data-msg-id="${escapeHtml(msg.id)}">${Icons.download} Save</button>
                      <button class="mini-btn" data-action="use-image-as-avatar" data-msg-id="${escapeHtml(msg.id)}">${Icons.user} Use as Avatar</button>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Per-Message Action Bar -->
            <div class="msg-toolbar">
              ${!isUser ? `
                <div class="swipe-bar" aria-label="Alternative replies">
                  <button class="swipe-btn" data-action="swipe-prev" data-msg-id="${escapeHtml(msg.id)}" ${altIndex <= 0 || State.isGenerating ? 'disabled' : ''} aria-label="Previous reply alternative">
                    ${Icons.chevLeft}
                  </button>
                  <span class="swipe-count">${altIndex + 1} / ${msg.alternatives.length}</span>
                  <button class="swipe-btn" data-action="swipe-next" data-msg-id="${escapeHtml(msg.id)}" ${State.isGenerating ? 'disabled' : ''} aria-label="Next or generate new reply alternative" title="Next alternative (or generate new)">
                    ${Icons.chevRight}
                  </button>
                </div>
              ` : `<div></div>`}

              <div class="msg-actions-group">
                <button class="msg-act-btn" data-action="copy-msg" data-msg-id="${escapeHtml(msg.id)}" title="Copy text" aria-label="Copy message">${Icons.copy}</button>
                <button class="msg-act-btn" data-action="edit-msg" data-msg-id="${escapeHtml(msg.id)}" title="Edit message" aria-label="Edit message">${Icons.edit}</button>
                <button class="msg-act-btn" data-action="msg-gen-image" data-msg-id="${escapeHtml(msg.id)}" title="Visualize this message" aria-label="Generate image for message">${Icons.image}</button>
                ${!isUser ? `
                  <button class="msg-act-btn" data-action="regen-msg" data-msg-id="${escapeHtml(msg.id)}" title="Regenerate reply" aria-label="Regenerate reply">${Icons.refresh}</button>
                  <button class="msg-act-btn" data-action="continue-msg" data-msg-id="${escapeHtml(msg.id)}" title="Continue message" aria-label="Continue generating from this message">${Icons.fastForward} <span>Continue</span></button>
                ` : ''}
                <button class="msg-act-btn" data-action="rewind-msg" data-msg-id="${escapeHtml(msg.id)}" title="Rewind chat to here" aria-label="Rewind chat to this message">${Icons.rewind}</button>
                <button class="msg-act-btn" data-action="delete-msg" data-msg-id="${escapeHtml(msg.id)}" title="Delete message" aria-label="Delete message">${Icons.trash}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHistoryScreen(main) {
      const allChats = Storage.getChats().sort((a, b) => b.updatedAt - a.updatedAt);
      const chars = Storage.getCharacters();
      const q = State.historySearchQuery.trim().toLowerCase();

      const filtered = allChats.filter(c => {
        if (State.historyFilterCharId && c.characterId !== State.historyFilterCharId) return false;
        if (!q) return true;
        const ch = chars.find(x => x.id === c.characterId);
        const lastMsg = c.messages[c.messages.length - 1];
        const lastText = lastMsg ? (lastMsg.alternatives[lastMsg.selectedIndex]?.text || '') : '';
        return (
          c.title.toLowerCase().includes(q) ||
          (ch && ch.name.toLowerCase().includes(q)) ||
          lastText.toLowerCase().includes(q)
        );
      });

      main.innerHTML = `
        <div class="top-bar">
          <div style="display:flex; align-items:center; gap:0.5rem;">
            ${State.historyFilterCharId ? `<button class="icon-btn" data-action="clear-history-filter" aria-label="Show all characters">${Icons.back}</button>` : ''}
            <div class="top-bar-title">Chat History (${filtered.length})</div>
          </div>
          ${State.historyFilterCharId ? `<button class="btn btn-secondary" data-action="clear-history-filter">Show All Characters</button>` : ''}
        </div>
        <div class="screen-scroll">
          <div class="container-narrow">
            <div class="search-bar-wrap" style="margin-bottom:1.25rem;">
              ${Icons.search}
              <input type="search" id="history-search-input" class="search-input" placeholder="Search saved conversations..." value="${escapeHtml(State.historySearchQuery)}" aria-label="Search chat history">
            </div>

            ${filtered.length === 0 ? `
              <div style="text-align:center; padding:3rem 1rem; background:var(--bg-surface); border:1px solid var(--border); border-radius:16px;">
                <p style="font-weight:600; margin-bottom:0.5rem;">No chat sessions found</p>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">Start a conversation from the Discover screen to see your history here.</p>
                <button class="btn btn-primary" data-action="nav" data-screen="discover">Browse Characters</button>
              </div>
            ` : `
              <div style="display:flex; flex-direction:column; gap:0.75rem;">
                ${filtered.map(chat => {
                  const ch = chars.find(x => x.id === chat.characterId) || { name: 'Unknown Character', avatar: makeSvgAvatar('?', '#333', '#111') };
                  const lastMsg = chat.messages[chat.messages.length - 1];
                  const lastText = lastMsg ? (lastMsg.alternatives[lastMsg.selectedIndex]?.text || '') : '';
                  const dateStr = new Date(chat.updatedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                  return `
                    <div class="char-card" style="flex-direction:row; align-items:center; justify-content:space-between; gap:1rem;" data-action="open-chat" data-chat-id="${escapeHtml(chat.id)}" data-char-id="${escapeHtml(ch.id)}">

                        <div style="min-width:0; flex:1;">
                          <div style="display:flex; align-items:center; gap:0.5rem;">
                            <span style="font-weight:700; font-size:0.98rem;">${escapeHtml(chat.title)}</span>
                            <span class="badge">${escapeHtml(ch.name)}</span>
                          </div>
                          <div style="font-size:0.84rem; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:0.2rem;">
                            ${escapeHtml(lastText.replace(/[*"]/g, '').slice(0, 90))}
                          </div>
                          <div style="font-size:0.74rem; color:var(--text-muted); margin-top:0.25rem;">${chat.messages.length} messages • ${escapeHtml(dateStr)}</div>
                        </div>
                      </div>
                      <div style="display:flex; gap:0.25rem;">
                        <button class="icon-btn" data-action="rename-chat" data-chat-id="${escapeHtml(chat.id)}" aria-label="Rename chat" title="Rename">${Icons.edit}</button>
                        <button class="icon-btn" style="color:var(--danger);" data-action="delete-chat" data-chat-id="${escapeHtml(chat.id)}" aria-label="Delete chat" title="Delete">${Icons.trash}</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        </div>
      `;

      const input = document.getElementById('history-search-input');
      if (input) {
        input.addEventListener('input', (e) => {
          State.historySearchQuery = e.target.value;
          renderMainView();
          const el = document.getElementById('history-search-input');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        });
      }
    }

    function scrollToChatBottom() {
      const container = document.getElementById('chat-messages');
      if (container) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function loadOlderMessages() {
      const chat = getActiveChat();
      if (!chat || State.isLoadingOlder) return;
      const total = chat.messages.length;
      if ((State.visibleMessageLimit || 40) >= total) return;

      State.isLoadingOlder = true;
      const container = document.getElementById('chat-messages');
      const oldScrollHeight = container ? container.scrollHeight : 0;
      const oldScrollTop = container ? container.scrollTop : 0;

      State.visibleMessageLimit = (State.visibleMessageLimit || 40) + 40;
      State.preserveScrollPosition = true;

      await renderMainView();

      const nextContainer = document.getElementById('chat-messages');
      if (nextContainer && oldScrollHeight > 0) {
        const heightDiff = nextContainer.scrollHeight - oldScrollHeight;
        nextContainer.scrollTop = oldScrollTop + heightDiff;
      }

      State.preserveScrollPosition = false;
      setTimeout(() => {
        State.isLoadingOlder = false;
      }, 200);
    }

    async function triggerAssistantGeneration({ chat, char, targetMessage = null, continueText = '' }) {
      if (State.isGenerating) return;
      State.isGenerating = true;
      State.abortController = new AbortController();

      const persona = getActivePersona();
      const settings = Storage.getSettings();

      let msgObj = targetMessage;
      if (!msgObj) {
        msgObj = {
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          role: 'char',
          selectedIndex: 0,
          alternatives: [{ text: '', createdAt: Date.now() }]
        };
        chat.messages.push(msgObj);
      } else if (!continueText) {
        // Adding a new alternative swipe
        msgObj.alternatives.push({ text: '', createdAt: Date.now() });
        msgObj.selectedIndex = msgObj.alternatives.length - 1;
      }

      const altIdx = msgObj.selectedIndex;
      updateChatInStorage(chat);
      await renderMainView();

      try {
        const finalReply = await API.generateReply({
          character: char,
          persona,
          messages: chat.messages,
          memory: chat.memory,
          authorsNote: chat.authorsNote,
          lorebookEntries: chat.lorebook,
          settings,
          signal: State.abortController.signal,
          continueFrom: continueText,
          onToken(chunk) {
            msgObj.alternatives[altIdx].text += chunk;
            const row = document.querySelector(`.msg-row[data-msg-id="${msgObj.id}"] .msg-text-body`);
            if (row) {
              row.innerHTML = formatRoleplayText(msgObj.alternatives[altIdx].text);
              scrollToChatBottom();
            }
          }
        });
        msgObj.alternatives[altIdx].text = finalReply;
        updateChatInStorage(chat);

        if (settings.showSuggestions) {
          State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          if (!msgObj.alternatives[altIdx].text) {
            msgObj.alternatives[altIdx].text = '*[Generation stopped by user]*';
          }
          updateChatInStorage(chat);
        } else {
          showToast('Generation failed: ' + (err.message || 'Unknown error'), 'error', () => {
            triggerAssistantGeneration({ chat, char, targetMessage: msgObj, continueText });
          });
        }
      } finally {
        State.isGenerating = false;
        State.abortController = null;
        await renderMainView();
      }
    }

    async function handleSendUserMessage(prefilledText = null) {
      if (State.isGenerating) return;
      const chat = getActiveChat();
      if (!chat) return;
      const char = await API.getCharacter(chat.characterId);
      if (!char) return;

      const inputEl = document.getElementById('chat-input');
      const rawText = prefilledText !== null ? prefilledText : (inputEl ? inputEl.value : '');
      const text = rawText.trim();
      if (!text) return;

      if (inputEl) inputEl.value = '';

      chat.messages.push({
        id: 'msg_' + Date.now(),
        role: 'user',
        selectedIndex: 0,
        alternatives: [{ text, createdAt: Date.now() }]
      });
      updateChatInStorage(chat);

      await triggerAssistantGeneration({ chat, char });
    }

    async function handleGenerateMessageImage(msgId = null) {
      const chat = getActiveChat();
      if (!chat) return;
      const char = await API.getCharacter(chat.characterId);
      const settings = Storage.getSettings();

      let targetMsg = msgId ? chat.messages.find(m => m.id === msgId) : null;
      if (targetMsg && targetMsg.alternatives[targetMsg.selectedIndex]?.imageLoading) {
        showToast('Image is already generating for this message.', 'info');
        return;
      }

      const inputEl = document.getElementById('chat-input');
      const customPrompt = inputEl && inputEl.value.trim() ? inputEl.value.trim() : '';

      let sceneText = '';
      if (!targetMsg) {
        if (inputEl && customPrompt) inputEl.value = '';
        if (customPrompt) {
          sceneText = customPrompt;
        } else {
          const recentMsgs = (chat.messages || []).slice(-3);
          sceneText = recentMsgs.map(m => {
            const t = m.alternatives[m.selectedIndex]?.text || '';
            const sender = m.role === 'user' ? 'User' : (char?.name || 'Character');
            return `${sender}: ${t.replace(/[*_#]/g, ' ').slice(0, 200)}`;
          }).join('\n') || `${char?.name || 'Character'}, ${char?.tagline || 'cinematic scene'}`;
        }

        const promptSummary = customPrompt || sceneText.replace(/[\r\n]+/g, ' ').slice(0, 90);
        targetMsg = {
          id: 'msg_' + Date.now(),
          role: 'char',
          selectedIndex: 0,
          alternatives: [{
            text: `*Visualizing scene: "${promptSummary}"*`,
            imagePrompt: promptSummary,
            imageLoading: true,
            imageLoadingStatus: 'Directing visual scene with AI...',
            createdAt: Date.now()
          }]
        };
        chat.messages.push(targetMsg);
      } else {
        const alt = targetMsg.alternatives[targetMsg.selectedIndex];
        const msgIdx = chat.messages.findIndex(m => m.id === targetMsg.id);
        const prevMsg = msgIdx > 0 ? chat.messages[msgIdx - 1] : null;
        const prevText = prevMsg ? (prevMsg.alternatives[prevMsg.selectedIndex]?.text || '') : '';
        const thisText = alt.text || '';
        sceneText = prevText ? `User: ${prevText.replace(/[*_#]/g, ' ').slice(0, 160)}\n${char?.name || 'Character'}: ${thisText.replace(/[*_#]/g, ' ').slice(0, 300)}` : thisText.replace(/[*_#]/g, ' ').slice(0, 400);

        alt.imagePrompt = alt.imagePrompt || alt.text.replace(/[*"]/g, '').slice(0, 90) || char?.name || 'Scene';
        alt.imageLoading = true;
        alt.imageLoadingStatus = 'Directing visual scene with AI...';
      }

      updateChatInStorage(chat);
      await renderMainView();

      try {
        const alt = targetMsg.alternatives[targetMsg.selectedIndex];
        const directorModel = settings?.imageGen?.promptDirectorModel || 'glm-4-6';

        let globalPrompt = '';
        let characterPrompt = '';

        if (directorModel !== 'off') {
          const modelLabel = directorModel === 'glm-4-6' ? 'GLM-4.6' : 'Xialong';
          alt.imageLoadingStatus = `🧠 AI Art Director (${modelLabel}): Visualizing scene & character...`;
          updateChatInStorage(chat);
          await renderMainView();

          const synth = await NovelAIVisualDirector.synthesizePrompt({
            character: char,
            sceneText,
            settings
          });
          globalPrompt = synth.globalPrompt;
          characterPrompt = synth.characterPrompt;
        }

        alt.imageLoadingStatus = '🎨 NovelAI Diffusion V5: Rendering illustration...';
        alt.imagePrompt = characterPrompt ? `${characterPrompt} | ${globalPrompt}` : (globalPrompt || alt.imagePrompt);
        updateChatInStorage(chat);
        await renderMainView();

        const url = await API.generateImage({
          prompt: globalPrompt || `${settings.imageGen.stylePrefix}, ${alt.imagePrompt}`,
          globalPrompt,
          characterPrompt,
          character: char,
          settings
        });

        alt.imageUrl = url;
        alt.imageLoading = false;
        delete alt.imageLoadingStatus;
        updateChatInStorage(chat);
        await renderMainView();
      } catch (err) {
        console.error('[AetherWeaver] Image generation error:', err);
        const alt = targetMsg.alternatives[targetMsg.selectedIndex];
        alt.imageLoading = false;
        delete alt.imageLoadingStatus;
        try {
          updateChatInStorage(chat);
        } catch (storageErr) {
          console.warn('[AetherWeaver] Storage update warning:', storageErr);
        }
        await renderMainView();
        showToast('Image generation failed: ' + (err.message || 'Unknown error'), 'error', () => handleGenerateMessageImage(targetMsg.id));
      }
    }

    function bindChatViewEvents() {
      const messagesContainer = document.getElementById('chat-messages');
      if (messagesContainer) {
        messagesContainer.addEventListener('scroll', () => {
          if (messagesContainer.scrollTop <= 60 && !State.isLoadingOlder) {
            const chat = getActiveChat();
            if (chat && chat.messages.length > (State.visibleMessageLimit || 40)) {
              loadOlderMessages();
            }
          }
        }, { passive: true });
      }

      const inputEl = document.getElementById('chat-input');
      if (inputEl) {
        inputEl.addEventListener('input', () => {
          inputEl.style.height = 'auto';
          inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
        });

        inputEl.addEventListener('keydown', (e) => {
          const isMobile = window.matchMedia('(max-width: 840px)').matches;
          if (e.key === 'Enter' && !e.shiftKey && !isMobile) {
            e.preventDefault();
            handleSendUserMessage();
          }
        });
      }

      // Context Drawer Auto-save (Memory, Author's Note, Lorebook)
      const memEl = document.getElementById('ctx-memory');
      const anEl = document.getElementById('ctx-authors-note');
      if (memEl) {
        memEl.addEventListener('input', () => {
          const chat = getActiveChat();
          if (chat) {
            chat.memory = memEl.value;
            updateChatInStorage(chat);
          }
        });
      }
      if (anEl) {
        anEl.addEventListener('input', () => {
          const chat = getActiveChat();
          if (chat) {
            chat.authorsNote = anEl.value;
            updateChatInStorage(chat);
          }
        });
      }

      document.querySelectorAll('.lorebook-entry-card').forEach(card => {
        const loreId = card.getAttribute('data-lore-id');
        const syncLore = () => {
          const chat = getActiveChat();
          if (!chat) return;
          const entry = (chat.lorebook || []).find(l => l.id === loreId);
          if (!entry) return;
          entry.name = card.querySelector('.lore-name-input').value;
          entry.enabled = card.querySelector('.lore-enabled-toggle').checked;
          entry.keywords = card.querySelector('.lore-keys-input').value.split(',').map(k => k.trim()).filter(Boolean);
          entry.text = card.querySelector('.lore-text-input').value;
          updateChatInStorage(chat);
        };
        card.querySelectorAll('input, textarea').forEach(el => {
          el.addEventListener('input', syncLore);
          el.addEventListener('change', syncLore);
        });
      });
    }

    function bindEditorEvents(draft) {
      const form = document.getElementById('char-editor-form');
      const nameIn = document.getElementById('ed-name');
      const tagIn = document.getElementById('ed-tagline');
      const tagsIn = document.getElementById('ed-tags');
      const avatarPreview = document.getElementById('editor-avatar-preview');
      const cardAvatar = document.getElementById('preview-card-avatar');
      const fileIn = document.getElementById('editor-avatar-file');
      const genBtn = document.getElementById('editor-gen-avatar-btn');

      const syncPreview = () => {
        document.getElementById('preview-card-name').textContent = nameIn.value.trim() || 'Unnamed Character';
        document.getElementById('preview-card-tagline').textContent = tagIn.value.trim() || 'Your character tagline will appear here...';
        const tags = tagsIn.value.split(',').map(t => t.trim()).filter(Boolean);
        document.getElementById('preview-card-tags').innerHTML = tags.slice(0, 3).map(t => `<span class="badge">${escapeHtml(t)}</span>`).join('');
      };

      [nameIn, tagIn, tagsIn].forEach(el => el.addEventListener('input', syncPreview));

      fileIn.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          const dataUrl = reader.result;
          const key = 'custom_avatar_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          await ImageStore.save(key, dataUrl);
          draft.avatar = 'idb:' + key;
          avatarPreview.src = ImageStore.resolveUrl(draft.avatar);
          cardAvatar.src = ImageStore.resolveUrl(draft.avatar);
        };
        reader.readAsDataURL(file);
      });

      genBtn.addEventListener('click', async () => {
        genBtn.disabled = true;
        genBtn.textContent = 'Generating...';
        try {
          const uri = await API.generateAvatar({
            character: { name: nameIn.value || 'Character', description: document.getElementById('ed-description').value }
          });
          draft.avatar = uri;
          avatarPreview.src = ImageStore.resolveUrl(uri);
          cardAvatar.src = ImageStore.resolveUrl(uri);
          showToast('Generated new character portrait.', 'success');
        } catch (err) {
          showToast('Failed to generate avatar: ' + (err.message || 'Unknown error'), 'error');
        } finally {
          genBtn.disabled = false;
          genBtn.innerHTML = `${Icons.sparkles} Generate Avatar`;
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saved = await API.saveCharacter({
          ...draft,
          name: nameIn.value.trim(),
          tagline: tagIn.value.trim(),
          greeting: document.getElementById('ed-greeting').value.trim(),
          description: document.getElementById('ed-description').value.trim(),
          exampleDialogue: document.getElementById('ed-dialogue').value.trim(),
          tags: tagsIn.value.split(',').map(t => t.trim()).filter(Boolean),
          visibility: document.getElementById('ed-visibility').value
        });
        showToast(`Saved "${saved.name}".`, 'success');
        State.activeCharacterId = saved.id;
        State.screen = 'profile';
        renderMainView();
      });
    }

    function downloadJsonFile(filename, dataObj) {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function promptJsonImport(callback) {
      const fileInput = document.getElementById('global-file-input');
      fileInput.value = '';
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            callback(parsed);
          } catch (err) {
            showToast('Invalid JSON file: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      };
      fileInput.click();
    }
