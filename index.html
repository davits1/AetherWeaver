<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="medium" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A1714">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AetherWeaver — Roleplay & Character Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    /* ==========================================================================
       DESIGN BRIEF: "Reading room / well-worn paperback"
       --------------------------------------------------------------------------
       Concept:
       A warm, bookish, tactile space designed for reading and writing stories,
       replacing tech-dashboard AI aesthetic with the quiet dignity, warmth, and
       craftsmanship of well-worn paperbacks, classic reading rooms, and library
       index cards.

       Color Tokens:
       - Light Theme:
         Warm cream paper canvas (#F4EFE6), parchment surfaces (#FAF7F2), elevated
         surfaces (#EFE8DC / hover #E6DFC8), near-black warm carbon ink (#231F1A),
         muted umber-grey secondary text (#635B52 / #877E73), hairline warm borders
         (#DDD3C3). Single focal accent: terracotta / rust (#B4532A, hover #96411B,
         soft rgba(180, 83, 42, 0.12)). No blue or purple tint anywhere.
       - Dark Theme:
         Warm charcoal background (#1A1714), charred-wood surfaces (#221E1A),
         elevated study surfaces (#2B2622 / hover #36302B), antique warm off-white
         text (#E9E1D3), muted stone secondary text (#A89F91 / #7D7467), hairline
         warm charcoal borders (#38322B). Single focal accent: copper / amber
         (#D98A4E, hover #E59B63, soft rgba(217, 138, 78, 0.14)). No blue or
         purple tint anywhere.

       Type Scale:
       - Serif system stack ("Iowan Old Style", "Palatino Linotype", "URW Palladio L",
         P052, Palatino, Georgia, serif) for all headings, brand wordmark, and chat
         messages (16-17px / line-height ~1.65 / max-width ~70ch).
       - System sans (-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
         Arial, sans-serif) for toolbars, inputs, buttons, and control metadata.
       - Small caps / letter-spaced labels (0.05em - 0.08em uppercase) for metadata,
         speakers, section headers, and card tags.

       Radius & Spacing Scale:
       - Crisp bookish geometry: 4px to 6px maximum, never 16px+ or pill-shapes.
       - 1px hairline borders instead of drop shadows. No glows, no gradients,
         no glassmorphism/backdrop blur.
       - Motion: Subtle 150ms ease, no bounce, full prefers-reduced-motion support.
       ========================================================================== */

    /* ==========================================================================
       CSS VARIABLES & THEME TOKENS
       ========================================================================== */
    :root, [data-theme="dark"] {
      --font-serif: "Iowan Old Style", "Palatino Linotype", "URW Palladio L", P052, Palatino, Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;

      --radius-xs: 2px;
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;

      --bg-base: #1A1714;
      --bg-surface: #221E1A;
      --bg-elevated: #2B2622;
      --bg-elevated-hover: #36302B;
      --bg-glass: #221E1A;
      --border: #38322B;
      --border-focus: #D98A4E;
      --text-primary: #E9E1D3;
      --text-secondary: #A89F91;
      --text-muted: #7D7467;
      --accent: #D98A4E;
      --accent-hover: #E59B63;
      --accent-soft: rgba(217, 138, 78, 0.14);
      --accent-secondary: #C4975C;
      --danger: #C84B4B;
      --danger-soft: rgba(200, 75, 75, 0.15);
      --success: #6B8E5F;
      --warning: #C98A2C;
      --bubble-user: #26221E;
      --bubble-user-border: #3D362F;
      --bubble-char: #201C18;
      --bubble-char-border: #38322B;
      --rp-action: #D98A4E;
      --rp-quote: #FAF5EC;
      --shadow-sm: none;
      --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.45);
      --text-on-accent: #1A1714;
    }

    [data-theme="light"] {
      --bg-base: #F4EFE6;
      --bg-surface: #FAF7F2;
      --bg-elevated: #EFE8DC;
      --bg-elevated-hover: #E6DFC8;
      --bg-glass: #FAF7F2;
      --border: #DDD3C3;
      --border-focus: #B4532A;
      --text-primary: #231F1A;
      --text-secondary: #635B52;
      --text-muted: #877E73;
      --accent: #B4532A;
      --accent-hover: #96411B;
      --accent-soft: rgba(180, 83, 42, 0.12);
      --accent-secondary: #8C6239;
      --danger: #A6342E;
      --danger-soft: rgba(166, 52, 46, 0.12);
      --success: #4F6D43;
      --warning: #A66B15;
      --bubble-user: #EAE3D5;
      --bubble-user-border: #D4C8B5;
      --bubble-char: #FAF7F2;
      --bubble-char-border: #DDD3C3;
      --rp-action: #8F3A17;
      --rp-quote: #1F1A15;
      --shadow-sm: none;
      --shadow-lg: 0 4px 16px rgba(35, 31, 26, 0.08);
      --text-on-accent: #FAF7F2;
    }

    [data-font="small"] { --font-scale: 0.95rem; --msg-line-height: 1.55; }
    [data-font="medium"] { --font-scale: 1.05rem; --msg-line-height: 1.65; }
    [data-font="large"] { --font-scale: 1.15rem; --msg-line-height: 1.75; }

    [data-density="compact"] { --msg-gap: 0.6rem; --msg-pad: 0.65rem 0.9rem; }
    [data-density="comfortable"] { --msg-gap: 1.1rem; --msg-pad: 0.9rem 1.2rem; }
    [data-density="spacious"] { --msg-gap: 1.6rem; --msg-pad: 1.2rem 1.45rem; }

    /* ==========================================================================
       RESET & BASE LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, h4, .section-title, .top-bar-title, .brand-logo, #modal-title {
      font-family: var(--font-serif);
      letter-spacing: -0.01em;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    button {
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    svg {
      stroke-width: 1.5;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-xs); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ==========================================================================
       APP SHELL (SIDEBAR + MAIN + BOTTOM NAV)
       ========================================================================== */
    #app-shell {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Desktop Left Sidebar */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
      user-select: none;
    }

    .brand-wordmark, .brand-logo span {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .brand-logo svg {
      display: none;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.75rem;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-height: 42px;
      padding: 0.55rem 0.85rem;
      border-radius: var(--radius-sm);
      border-left: 3px solid transparent;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
      text-align: left;
    }

    .nav-btn:hover {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .nav-btn.active {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border-left: 3px solid var(--accent);
      font-weight: 600;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-section-title {
      padding: 0.85rem 1.15rem 0.35rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .sidebar-recents {
      flex: 1;
      overflow-y: auto;
      padding: 0.25rem 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .recent-sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.65rem;
      min-height: 42px;
      border-radius: var(--radius-sm);
      border-left: 2px solid transparent;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .recent-sidebar-item:hover {
      background-color: var(--bg-elevated);
      border-left-color: var(--border-focus);
    }

    .recent-sidebar-item.active {
      background-color: var(--bg-elevated);
      border-left-color: var(--accent);
    }

    .recent-sidebar-item .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .recent-sidebar-info {
      flex: 1;
      min-width: 0;
    }

    .recent-sidebar-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-sans);
    }

    .recent-sidebar-preview {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--font-sans);
    }

    .sidebar-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: var(--bg-surface);
    }

    .persona-pill {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 42px;
      padding: 0.35rem 0.6rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg-surface);
      flex: 1;
      min-width: 0;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
    }

    .persona-pill:hover {
      background-color: var(--bg-elevated);
      border-color: var(--border-focus);
    }

    .persona-pill img {
      border-radius: var(--radius-sm) !important;
      border: 1px solid var(--border);
    }

    /* Main Workspace Area */
    #main-view {
      flex: 1;
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background-color: var(--bg-base);
    }

    .screen-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.5rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    }

    .container-wide {
      max-width: 1180px;
      margin: 0 auto;
      width: 100%;
    }

    .container-narrow {
      max-width: 840px;
      margin: 0 auto;
      width: 100%;
    }

    /* Mobile Bottom Navigation Bar */
    #bottom-nav {
      display: none;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 30;
    }

    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 58px;
    }

    .bottom-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      flex: 1;
      height: 100%;
      min-height: 44px;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color 150ms ease, border-color 150ms ease;
    }

    .bottom-nav-btn svg {
      width: 22px;
      height: 22px;
    }

    .bottom-nav-btn.active {
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
      font-weight: 600;
    }

    /* ==========================================================================
       COMMON UI COMPONENTS (BUTTONS, INPUTS, CHIPS, CARDS)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 42px;
      padding: 0.55rem 1.1rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid transparent;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
      white-space: nowrap;
    }

    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .btn-primary {
      background-color: var(--accent);
      color: var(--text-on-accent);
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background-color: var(--bg-elevated-hover);
      border-color: var(--border-focus);
    }

    .btn-danger {
      background-color: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .btn-danger:hover {
      background-color: var(--danger);
      color: #FAF7F2;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
    }
    .btn-ghost:hover {
      background-color: var(--bg-elevated);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      color: var(--text-secondary);
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
      flex-shrink: 0;
    }
    .icon-btn:hover {
      background-color: var(--bg-elevated);
      border-color: var(--border);
      color: var(--text-primary);
    }
    .icon-btn svg { width: 20px; height: 20px; }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      min-height: 34px;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-sm);
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 0.74rem;
      font-weight: 600;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .mini-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent);
      background-color: var(--bg-elevated-hover);
    }

    .input-field, .textarea-field, .select-field {
      width: 100%;
      min-height: 42px;
      padding: 0.65rem 0.9rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-sans);
      transition: border-color 150ms ease;
    }

    .textarea-field {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    .input-field:focus, .textarea-field:focus, .select-field:focus {
      outline: none;
      border-color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.1rem;
    }

    .form-label {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Top Bar for Mobile / Sub-screens */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      min-height: 58px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar-title {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================================
       SCREEN 1: HOME / DISCOVER
       ========================================================================== */
    .discover-hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .search-bar-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-bar-wrap svg {
      position: absolute;
      left: 1rem;
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 46px;
      padding: 0.75rem 2.8rem 0.75rem 2.85rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: var(--font-sans);
      box-shadow: none;
      transition: border-color 150ms ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-clear-btn {
      position: absolute;
      right: 0.4rem;
    }

    .chip-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0.45rem 1rem;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .chip:hover {
      background-color: var(--bg-elevated);
      border-color: var(--border-focus);
      color: var(--text-primary);
    }

    .chip.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: var(--text-on-accent);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0 0.85rem;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Recent Chats Horizontal Row */
    .recents-row {
      display: flex;
      gap: 0.85rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .recent-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 240px;
      max-width: 280px;
      padding: 0.75rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      box-shadow: none;
      transition: transform 150ms ease, border-color 150ms ease;
      flex-shrink: 0;
    }

    .recent-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .recent-card img {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Character Cards Grid (Bookish Index Card / Cover Layout) */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .char-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      cursor: pointer;
      box-shadow: none;
      transition: transform 150ms ease, border-color 150ms ease;
      position: relative;
    }

    .char-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: none;
    }

    .char-card-top {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0.75rem;
    }

    .char-avatar-lg {
      width: 100%;
      aspect-ratio: 3 / 4;
      height: auto;
      max-height: 280px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .char-card-meta {
      flex: 1;
      min-width: 0;
    }

    .char-card-name {
      font-family: var(--font-serif);
      font-size: 1.12rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.15rem;
      color: var(--text-primary);
    }

    .char-card-creator {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .char-card-tagline {
      font-family: var(--font-serif);
      font-size: 0.88rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }

    .char-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .tag-badges {
      display: flex;
      gap: 0.35rem;
      overflow: hidden;
      flex-wrap: nowrap;
    }

    .badge {
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border);
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ==========================================================================
       SCREEN 2: CHARACTER PROFILE
       ========================================================================== */
    .profile-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .profile-header {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .profile-avatar {
      width: 120px;
      height: 150px;
      aspect-ratio: 3 / 4;
      border-radius: var(--radius-md);
      object-fit: cover;
      border: 2px solid var(--accent);
      background-color: var(--bg-elevated);
    }

    .profile-title-area {
      flex: 1;
      min-width: 220px;
    }

    .profile-stats {
      display: flex;
      gap: 1.25rem;
      margin-top: 0.65rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .code-box {
      background-color: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-secondary);
      max-height: 300px;
      overflow-y: auto;
    }

    /* ==========================================================================
       SCREEN 3: CHAT VIEW & CONTEXT DRAWER
       ========================================================================== */
    .chat-layout {
      display: flex;
      flex: 1;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .chat-main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      position: relative;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.85rem;
      min-height: 58px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .chat-header-char {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
      min-width: 0;
      padding: 0.25rem 0.4rem;
      border-radius: var(--radius-sm);
      transition: background-color 150ms ease;
    }
    .chat-header-char:hover { background-color: var(--bg-elevated); }

    .chat-header-char img {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      object-fit: cover;
      flex-shrink: 0;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      position: relative;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 230px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-lg);
      padding: 0.4rem;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      min-height: 38px;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-xs);
      font-size: 0.86rem;
      font-weight: 500;
      font-family: var(--font-sans);
      color: var(--text-primary);
      text-align: left;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .dropdown-item:hover { background-color: var(--bg-elevated); }
    .dropdown-item.danger { color: var(--danger); }
    .dropdown-item svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Message Stream (Novel / Script Reading Layout) */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: var(--msg-gap);
    }

    .chat-load-more-wrap {
      display: flex;
      justify-content: center;
      padding: 0.5rem 0 0.75rem;
      width: 100%;
    }

    .load-more-btn {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      padding: 0.4rem 1rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background-color: var(--bg-surface);
      color: var(--text-secondary);
      gap: 0.45rem;
      box-shadow: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .load-more-btn:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .load-more-btn:active {
      transform: translateY(1px);
    }

    .msg-row {
      display: flex;
      gap: 0.85rem;
      max-width: 70ch;
      width: 100%;
      margin: 0 auto;
      align-items: flex-start;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
      margin-top: 0.2rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .msg-content-wrap {
      display: flex;
      flex-direction: column;
      max-width: calc(100% - 50px);
      min-width: 180px;
      flex: 1;
    }

    .msg-row.user .msg-content-wrap {
      align-items: flex-end;
    }

    .msg-sender-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 0.15rem;
    }

    .msg-sender-name {
      color: var(--text-secondary);
    }

    /* Manuscript / Novel Typeset Message Box */
    .msg-bubble {
      padding: var(--msg-pad);
      border-radius: var(--radius-sm);
      font-family: var(--font-serif);
      font-size: var(--font-scale);
      line-height: var(--msg-line-height);
      background-color: var(--bubble-char);
      border: 1px solid var(--bubble-char-border);
      border-left: 3px solid var(--accent);
      color: var(--text-primary);
      word-wrap: break-word;
      overflow-wrap: break-word;
      width: 100%;
      box-shadow: none;
    }

    .msg-row.user .msg-bubble {
      background-color: var(--bubble-user);
      border: 1px solid var(--bubble-user-border);
      border-left: 3px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .msg-row.char .msg-bubble {
      border-radius: var(--radius-sm);
    }

    /* Roleplay Formatting inside Messages */
    .msg-bubble p {
      margin-bottom: 0.75rem;
      line-height: inherit;
    }
    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .rp-action {
      font-style: italic;
      color: var(--rp-action);
      font-family: var(--font-serif);
    }

    .rp-quote {
      color: var(--rp-quote);
      font-weight: 600;
    }

    .msg-bubble code {
      font-family: var(--font-mono);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 0.15rem 0.35rem;
      border-radius: var(--radius-xs);
      font-size: 0.88em;
    }

    .msg-bubble pre {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    /* Image Attachment in Message */
    .msg-image-card {
      margin-top: 0.75rem;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: var(--bg-base);
      max-width: 380px;
    }

    .msg-image-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .msg-image-meta {
      padding: 0.55rem 0.75rem;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      background-color: var(--bg-surface);
    }

    .msg-image-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    /* Per-Message Action Bar & Swipe Controls */
    .msg-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.35rem;
      width: 100%;
    }

    .swipe-bar {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.1rem 0.25rem;
    }

    .swipe-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-xs);
      color: var(--text-secondary);
      transition: background-color 150ms ease, color 150ms ease;
    }
    .swipe-btn:hover:not(:disabled) {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }
    .swipe-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .swipe-count {
      font-family: var(--font-sans);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0 0.35rem;
      color: var(--text-secondary);
    }

    .msg-actions-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.15rem;
    }

    .msg-act-btn {
      min-width: 34px;
      min-height: 34px;
      padding: 0.3rem 0.45rem;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      color: var(--text-muted);
      font-size: 0.74rem;
      font-family: var(--font-sans);
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .msg-act-btn:hover {
      background-color: var(--bg-elevated);
      border-color: var(--border);
      color: var(--text-primary);
    }
    .msg-act-btn svg { width: 15px; height: 15px; }

    /* Typing & Skeleton Loading (No bounce, no shimmer gradients) */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 0.35rem 0.25rem;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent);
      animation: typingPulse 1.4s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1); }
    }

    .skeleton-box {
      width: 100%;
      height: 220px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      animation: skeletonPulse 1.5s infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.85rem;
    }

    @keyframes skeletonPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spin {
      animation: spin 0.8s linear infinite;
    }

    /* Chat Composer & Suggested Replies */
    .chat-composer-wrap {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 0.65rem 1rem calc(0.65rem + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }

    .chat-composer-inner {
      max-width: 70ch;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .suggestions-bar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: none;
    }
    .suggestions-bar::-webkit-scrollbar { display: none; }

    .suggestion-pill {
      padding: 0.4rem 0.8rem;
      min-height: 36px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      font-family: var(--font-sans);
      color: var(--text-secondary);
      white-space: nowrap;
      cursor: pointer;
      -webkit-user-select: none;
      user-select: none;
      transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .suggestion-pill:hover {
      border-color: var(--accent);
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 0.45rem;
    }

    #chat-input {
      flex: 1;
      min-height: 42px;
      max-height: 150px;
      padding: 0.65rem 0.9rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text-primary);
      resize: none;
      line-height: 1.5;
      overflow-y: auto;
      transition: border-color 150ms ease;
    }
    #chat-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Right Collapsible Context Panel (NovelAI Memory / Author's Note / Lorebook) */
    #context-drawer {
      width: 340px;
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 25;
      transition: transform 180ms ease;
    }

    #context-drawer.hidden {
      display: none;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      min-height: 58px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .lorebook-entry-card {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    /* ==========================================================================
       MODALS, DIALOGS, TOASTS (Grounded, clean, no glassmorphism)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(18, 15, 12, 0.72);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 500px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    #toast-container {
      position: fixed;
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
      right: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 120;
      max-width: calc(100vw - 2.5rem);
    }

    .toast {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      min-width: 260px;
      font-family: var(--font-sans);
      font-size: 0.88rem;
    }

    .toast.error { border-left-color: var(--danger); }
    .toast.success { border-left-color: var(--success); }

    /* ==========================================================================
       FORMS, COLLAPSIBLE PANELS, GRIDS
       ========================================================================== */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    details.collapsible-panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    details.collapsible-panel > summary {
      padding: 0.85rem 1.25rem;
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      background-color: var(--bg-elevated);
      border-bottom: 1px solid transparent;
      transition: background-color 150ms ease;
    }

    details.collapsible-panel[open] > summary {
      border-bottom-color: var(--border);
    }

    details.collapsible-panel > summary::-webkit-details-marker { display: none; }

    .panel-content {
      padding: 1.25rem;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 5px;
      background: var(--border);
      border-radius: var(--radius-xs);
      cursor: pointer;
    }

    /* Toggle Switch */
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      min-height: 42px;
      -webkit-user-select: none;
      user-select: none;
    }

    .switch-input {
      -webkit-appearance: none;
      appearance: none;
      width: 40px;
      height: 22px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      position: relative;
      cursor: pointer;
      transition: background-color 150ms ease, border-color 150ms ease;
      flex-shrink: 0;
    }
    .switch-input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 2px;
      background-color: var(--text-secondary);
      transition: transform 150ms ease, background-color 150ms ease;
    }
    .switch-input:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }
    .switch-input:checked::after {
      transform: translateX(18px);
      background-color: var(--text-on-accent);
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ==========================================================================
       RESPONSIVE BREAKPOINTS (MOBILE <= 840px)
       ========================================================================== */
    @media (max-width: 840px) {
      #app-shell {
        flex-direction: column;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
      }

      #sidebar {
        display: none !important;
        width: 0 !important;
      }

      #main-view {
        flex: 1;
        min-height: 0;
        width: 100%;
        height: auto;
      }

      #bottom-nav {
        display: block !important;
        width: 100%;
        flex-shrink: 0;
        position: relative;
        z-index: 40;
        border-top: 1px solid var(--border);
        background-color: var(--bg-surface);
      }

      body.in-chat #bottom-nav {
        display: none !important;
      }

      .screen-scroll {
        padding: 1rem;
        padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));
      }

      .two-col-grid { grid-template-columns: 1fr; }
      .char-grid { grid-template-columns: 1fr; }

      /* Context Drawer becomes a clean bottom sheet on mobile */
      #context-drawer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 82dvh;
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: var(--radius-md) var(--radius-md) 0 0;
        box-shadow: var(--shadow-lg);
        z-index: 80;
      }

      #context-drawer.hidden {
        display: none !important;
      }

      .msg-image-card {
        max-width: 100%;
      }

      .chat-header-actions .btn span {
        display: none;
      }

      #toast-container {
        bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
        left: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <!-- Left Sidebar (Desktop) -->
    <aside id="sidebar" aria-label="Main Navigation"></aside>

    <!-- Main Dynamic View -->
    <main id="main-view" role="main"></main>

    <!-- Bottom Navigation (Mobile) -->
    <nav id="bottom-nav" aria-label="Mobile Navigation"></nav>
  </div>

  <!-- Modal & Toast Containers -->
  <div id="modal-root"></div>
  <div id="toast-container" aria-live="polite"></div>

  <!-- Hidden File Input for Imports -->
  <input type="file" id="global-file-input" accept=".json,application/json" style="display:none">

  <script>
    /**
     * ============================================================================
     * 1. DATA SHAPES (JSDoc Reference for Integration Agents)
     * ============================================================================
     *
     * @typedef {Object} Character
     * @property {string} id - Unique identifier (e.g., "char_1")
     * @property {string} name - Display name of the character
     * @property {string} tagline - Short 1-line hook shown on cards
     * @property {string} description - Long definition / personality / lore
     * @property {string} greeting - Initial message when starting a new chat
     * @property {string} exampleDialogue - Example message exchanges (`{{char}}: ...`)
     * @property {string} avatar - Data URI or URL for avatar image
     * @property {string[]} tags - Category/genre tags (e.g., ["Sci-Fi", "Original"])
     * @property {string} creator - Handle of creator (e.g., "@you" or "@aether")
     * @property {number} chatCount - Cosmetic interaction counter
     * @property {'public'|'unlisted'|'private'} visibility - Cosmetic visibility state
     * @property {number} updatedAt - Epoch timestamp (ms)
     *
     * @typedef {Object} MessageAlternative
     * @property {string} text - Markdown/roleplay text content
     * @property {string} [imageUrl] - Optional attached/generated image URL or data URI
     * @property {string} [imagePrompt] - Prompt used to generate the image
     * @property {boolean} [imageLoading] - True while image is generating
     * @property {number} createdAt - Epoch timestamp (ms)
     *
     * @typedef {Object} Message
     * @property {string} id - Unique identifier
     * @property {'user'|'char'} role - Sender role
     * @property {MessageAlternative[]} alternatives - Swipeable message versions
     * @property {number} selectedIndex - Active index in `alternatives`
     *
     * @typedef {Object} LorebookEntry
     * @property {string} id - Unique identifier
     * @property {string} name - Entry label
     * @property {string[]} keywords - Trigger keys (comma-separated in UI)
     * @property {string} text - Lore content injected when triggered
     * @property {boolean} enabled - Active toggle
     *
     * @typedef {Object} Chat
     * @property {string} id - Unique identifier
     * @property {string} characterId - Associated character ID
     * @property {string} title - Chat session name
     * @property {Message[]} messages - Ordered message history
     * @property {string} memory - Per-chat NovelAI-style Memory text
     * @property {string} authorsNote - Per-chat NovelAI-style Author's Note
     * @property {LorebookEntry[]} lorebook - Per-chat Lorebook entries
     * @property {number} updatedAt - Epoch timestamp (ms)
     *
     * @typedef {Object} Persona
     * @property {string} id - Unique identifier
     * @property {string} name - User's in-roleplay name
     * @property {string} description - User appearance/background details
     * @property {string} avatar - Data URI or URL
     *
     * @typedef {Object} Settings
     * @property {'dark'|'light'} theme
     * @property {'small'|'medium'|'large'} fontSize
     * @property {'compact'|'comfortable'|'spacious'} density
     * @property {boolean} showSuggestions - Toggle suggested replies bar in chat
     * @property {number} creativity - Simple slider (0.1 to 1.5)
     * @property {'short'|'medium'|'long'} responseLength - Simple length preset
     * @property {Object} advancedText
     * @property {number} advancedText.temperature
     * @property {number} advancedText.topP
     * @property {number} advancedText.topK
     * @property {number} advancedText.minP
     * @property {number} advancedText.maxTokens
     * @property {number} advancedText.repetitionPenalty
     * @property {string[]} advancedText.stopSequences
     * @property {string} advancedText.systemPromptOverride
     * @property {Object} imageGen
     * @property {'portrait'|'landscape'|'square'} imageGen.sizePreset
     * @property {string} imageGen.negativePrompt
     * @property {number} imageGen.seed - (-1 for random)
     * @property {number} imageGen.steps
     * @property {number} imageGen.guidance
     * @property {string} imageGen.sampler
     * @property {string} imageGen.stylePrefix
     * @property {Object} provider
     * @property {'mock'|'novelai'|'local'} provider.type
     * @property {string} provider.apiKey - Optional NovelAI token override (empty = proxy's NOVELAI_TOKEN)
     * @property {string} provider.baseUrl
     * @property {'xialong-v1'|'glm-4-6'} provider.model - NovelAI text model
     * @property {string} provider.proxyBase - Same-origin proxy path (default "/proxy")
     * @property {number} provider.contextTokens - Prompt + reply token budget (default 28672)
     * @property {string} provider.prefill - Optional text that starts every new reply
     */

    /* Helper to create vivid deterministic SVG data URI avatars offline */
    function makeSvgAvatar(initials, bg1, bg2, shapeType = 'circle') {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bg1}"/>
            <stop offset="100%" stop-color="${bg2}"/>
          </linearGradient>
        </defs>
        <rect width="160" height="160" fill="url(#g)"/>
        ${shapeType === 'diamond'
          ? '<polygon points="80,14 146,80 80,146 14,80" fill="rgba(255,255,255,0.1)" />'
          : '<circle cx="80" cy="80" r="56" fill="rgba(255,255,255,0.1)"/>'}
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
              fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="52">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function makeSceneSvg(prompt, characterName, sizePreset = 'portrait') {
      const dims = sizePreset === 'landscape' ? [640, 420] : sizePreset === 'square' ? [512, 512] : [440, 600];
      const hash = Array.from(prompt + characterName).reduce((a, c) => ((a << 5) - a) + c.charCodeAt(0), 0);
      const hue1 = Math.abs(hash) % 360;
      const hue2 = (hue1 + 65) % 360;
      const safePrompt = (prompt || 'Atmospheric portrait').replace(/[<>&"]/g, '').slice(0, 55);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dims[0]} ${dims[1]}">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(${hue1}, 65%, 22%)"/>
            <stop offset="55%" stop-color="hsl(${hue2}, 60%, 15%)"/>
            <stop offset="100%" stop-color="#090b10"/>
          </linearGradient>
          <radialGradient id="glow" cx="50%" cy="38%" r="45%">
            <stop offset="0%" stop-color="hsl(${hue2}, 85%, 65%)" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bg)"/>
        <rect width="100%" height="100%" fill="url(#glow)"/>
        <circle cx="${dims[0] * 0.5}" cy="${dims[1] * 0.36}" r="${Math.min(dims[0], dims[1]) * 0.18}" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
        <path d="M 0 ${dims[1] * 0.75} Q ${dims[0] * 0.35} ${dims[1] * 0.62} ${dims[0] * 0.65} ${dims[1] * 0.72} T ${dims[0]} ${dims[1] * 0.68} L ${dims[0]} ${dims[1]} L 0 ${dims[1]} Z" fill="rgba(0,0,0,0.45)"/>
        <text x="24" y="${dims[1] - 46}" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-weight="700" font-size="18">${characterName}</text>
        <text x="24" y="${dims[1] - 22}" fill="rgba(255,255,255,0.55)" font-family="sans-serif" font-size="13">${safePrompt}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    /**
     * ============================================================================
     * 2. INTEGRATION LAYER (External API Stubs — Replace Here Later)
     * ============================================================================
     * The UI NEVER calls `fetch` directly. All external operations go through `API`.
     */

    /* NAI-TEXT:BEGIN — NovelAI text provider (used only by API.generateReply) */
    const NovelAIText = {
      DEFAULT_MODEL: 'xialong-v1',
      MODELS: ['xialong-v1', 'glm-4-6'],
      DEFAULT_CONTEXT_TOKENS: 28672,
      // TODO(INTEGRATION.md section 4 is missing from the handoff file): Author's Note depth is an
      // assumption. It is inserted before the last N history lines (NovelAI's story default is
      // "a few newlines from the bottom").
      AUTHORS_NOTE_DEPTH: 3,
      LORE_SCAN_MESSAGES: 4,      // lorebook keys are searched in the last N history messages...
      LORE_SCAN_CHARS: 3000,      // ...capped to this many trailing characters
      CHARS_PER_TOKEN: 3.2,       // approximation; slightly overestimates tokens for English (safer)
      SAFETY_TOKENS: 64,
      STOPPED_PLACEHOLDER: '*[Generation stopped by user]*',
      DEFAULT_PREAMBLE: 'The following is a roleplay chat between {{user}} and {{char}}. Continue the script by writing only {{char}}\'s next reply. Stay in character, write actions in *asterisks* and spoken dialogue in "quotes", and never write lines, actions, or thoughts for {{user}}.',
      streamUnsupported: false,   // set for this session once stream:true is proven unsupported

      estimateTokens(str) {
        return str ? Math.ceil(str.length / this.CHARS_PER_TOKEN) : 0;
      },

      fillNames(str, charName, userName) {
        return String(str || '')
          .replace(/\{\{char\}\}/gi, charName)
          .replace(/\{\{user\}\}/gi, userName);
      },

      /** Stop sequences typed in a one-line input arrive as a literal backslash-n; convert to real newlines. */
      normalizeStop(str) {
        return String(str || '').replace(/\\n/g, '\n').replace(/\\t/g, '\t');
      },

      altText(msg) {
        const alt = msg && Array.isArray(msg.alternatives) ? msg.alternatives[msg.selectedIndex] : null;
        return alt && typeof alt.text === 'string' ? alt.text : '';
      },

      /** Index of the message being generated (excluded from history). Messages after it are ignored too. */
      findTargetIndex(messages, continueFrom) {
        for (let i = messages.length - 1; i >= 0; i--) {
          const m = messages[i];
          if (!m || m.role !== 'char') continue;
          const t = this.altText(m);
          if (continueFrom ? t === continueFrom : t === '') return i;
        }
        return messages.length;
      },

      /** Length of the longest suffix of `text` that is a proper prefix of any stop sequence. */
      partialStopSuffix(text, stops) {
        let best = 0;
        for (const s of stops) {
          for (let k = Math.min(s.length - 1, text.length); k > best; k--) {
            if (text.endsWith(s.slice(0, k))) { best = k; break; }
          }
        }
        return best;
      },

      buildRequest({ character, persona, messages, memory, authorsNote, lorebookEntries, settings, continueFrom }) {
        const adv = settings.advancedText || {};
        const prov = settings.provider || {};
        const charName = String((character && character.name) || 'Character').trim();
        const userName = String((persona && persona.name) || 'User').trim();
        const fill = (s) => this.fillNames(s, charName, userName).trim();
        const num = (v, d) => (typeof v === 'number' && Number.isFinite(v) ? v : d);

        const maxTokens = Math.max(1, Math.round(num(adv.maxTokens, 220)));
        let contextTokens = parseInt(prov.contextTokens, 10);
        if (!Number.isFinite(contextTokens) || contextTokens < 1024) contextTokens = this.DEFAULT_CONTEXT_TOKENS;
        const budget = contextTokens - maxTokens - this.SAFETY_TOKENS;

        // History (everything before the message being generated)
        const targetIdx = this.findTargetIndex(messages || [], continueFrom);
        const history = (messages || []).slice(0, targetIdx)
          .map(m => ({ speaker: m.role === 'user' ? userName : charName, text: fill(this.altText(m)) }))
          .filter(h => h.text && h.text !== this.STOPPED_PLACEHOLDER);
        const historyLines = history.map(h => `${h.speaker}: ${h.text}`);

        // Lorebook: enabled entries whose keyword appears (case-insensitive) in recent text
        const scanText = (history.slice(-this.LORE_SCAN_MESSAGES).map(h => h.text).join('\n') + '\n' + (continueFrom || ''))
          .slice(-this.LORE_SCAN_CHARS)
          .toLowerCase();
        const triggeredLore = (lorebookEntries || []).filter(e =>
          e && e.enabled && String(e.text || '').trim() &&
          (e.keywords || []).some(k => {
            const key = fill(k).toLowerCase();
            return key && scanText.includes(key);
          })
        );
        let loreTexts = triggeredLore.map(e => fill(e.text));

        // Fixed blocks
        const preamble = fill(adv.systemPromptOverride) || fill(this.DEFAULT_PREAMBLE);
        const memoryBlock = fill(memory) ? `[Memory]\n${fill(memory)}` : '';
        const charDef = fill((character && (character.description || character.tagline)) || '');
        const characterBlock = `[${charName}]\n${charDef || charName}`;
        const personaBlock = fill(persona && persona.description) ? `[${userName}]\n${fill(persona.description)}` : '';
        let examplesBlock = fill(character && character.exampleDialogue) ? `[Example dialogue]\n${fill(character.exampleDialogue)}` : '';
        const anLine = fill(authorsNote) ? `[Author's Note: ${fill(authorsNote)}]` : '';

        // Reply seed: Continue text, otherwise the optional prefill (prefill is part of the visible reply)
        let prefill = this.fillNames(prov.prefill || '', charName, userName);
        if (!prefill.trim()) prefill = '';
        const seed = continueFrom ? continueFrom : prefill;
        const tail = `${charName}:` + (seed.trimEnd() ? ' ' + seed.trimEnd() : '');

        const header = () => [
          preamble,
          memoryBlock,
          loreTexts.length ? `[Lore]\n${loreTexts.join('\n')}` : '',
          characterBlock,
          personaBlock,
          examplesBlock
        ].filter(Boolean).join('\n\n');
        const fixedCost = () => this.estimateTokens(header()) + this.estimateTokens(anLine) + this.estimateTokens(tail) + 8;

        // Budget: Memory, character, Author's Note are never dropped. History is trimmed oldest-first.
        // Only if not even the newest history line fits are example dialogue, then lore, sacrificed.
        const newestCost = historyLines.length ? this.estimateTokens(historyLines[historyLines.length - 1]) + 1 : 0;
        const dropped = { examples: false, lore: 0 };
        if (fixedCost() + newestCost > budget && examplesBlock) { examplesBlock = ''; dropped.examples = true; }
        while (fixedCost() + newestCost > budget && loreTexts.length) { loreTexts = loreTexts.slice(0, -1); dropped.lore++; }

        let remaining = budget - fixedCost();
        const kept = [];
        for (let i = historyLines.length - 1; i >= 0; i--) {
          const cost = this.estimateTokens(historyLines[i]) + 1;
          if (cost > remaining && kept.length > 0) break;
          kept.unshift(historyLines[i]);
          remaining -= cost;
        }
        if (anLine) kept.splice(Math.max(0, kept.length - this.AUTHORS_NOTE_DEPTH), 0, anLine);

        const prompt = header() + '\n\n***\n' + (kept.length ? kept.join('\n') + '\n' : '') + tail;

        // Stop sequences: built-ins + user configured, with names filled and literal \n converted
        const stops = [];
        [`\n${userName}:`, '\nUSER:', '\nUser:', ...((adv.stopSequences || []).map(s => this.fillNames(this.normalizeStop(s), charName, userName)))]
          .forEach(s => { if (s && !stops.includes(s)) stops.push(s); });

        const payload = {
          model: this.MODELS.includes(prov.model) ? prov.model : this.DEFAULT_MODEL,
          prompt,
          max_tokens: maxTokens,
          temperature: num(adv.temperature, 1.4),
          min_length: 1,
          top_p: num(adv.topP, 0.938),
          top_k: Math.round(num(adv.topK, 60)),
          top_a: 1.0,
          typical_p: 1.0,
          tail_free_sampling: 1.0,
          repetition_penalty: num(adv.repetitionPenalty, 1.04),
          repetition_penalty_range: 2048,
          repetition_penalty_slope: 0,
          repetition_penalty_frequency: 0,
          repetition_penalty_presence: 0.05,
          min_p: num(adv.minP, 0.024),
          stop: stops
        };

        return {
          payload,
          stops,
          seed,
          isContinue: Boolean(continueFrom),
          stats: {
            contextTokens,
            budget,
            estimatedPromptTokens: this.estimateTokens(prompt),
            historyKept: kept.length - (anLine ? 1 : 0),
            historyTotal: historyLines.length,
            loreTriggered: triggeredLore.map(e => e.name),
            dropped
          }
        };
      },

      async readErrorDetail(res) {
        try {
          const text = (await res.text()).slice(0, 2000);
          try {
            const j = JSON.parse(text);
            const m = j && (j.message || j.error || j.detail);
            if (typeof m === 'string') return m.slice(0, 240);
            if (m && typeof m.message === 'string') return m.message.slice(0, 240);
          } catch (e) { /* not JSON */ }
          return text.replace(/\s+/g, ' ').trim().slice(0, 240);
        } catch (e) {
          return '';
        }
      },

      async httpError(res) {
        const detail = await this.readErrorDetail(res);
        const s = res.status;
        let msg;
        if (s === 401) msg = 'NovelAI rejected the API token (401). Check NOVELAI_TOKEN in .env or the token override in Settings.';
        else if (s === 403) msg = 'Request forbidden (403).';
        else if (s === 429) msg = 'NovelAI rate limit reached (429). Wait a few seconds and try again; avoid parallel generations.';
        else if (s === 502 && /^Proxy error/i.test(detail)) msg = 'The local proxy could not reach NovelAI (502).';
        else if (s >= 500) msg = `NovelAI server error (${s}). Try again in a moment.`;
        else msg = `NovelAI request failed (${s}).`;
        const err = new Error(detail ? `${msg} ${detail}` : msg);
        err.status = s;
        return err;
      },

      async generate({ character, persona, messages, memory, authorsNote, lorebookEntries, settings, signal, onToken, continueFrom = '' }) {
        if (signal && signal.aborted) throw new DOMException('Generation aborted', 'AbortError');

        const req = this.buildRequest({ character, persona, messages, memory, authorsNote, lorebookEntries, settings, continueFrom });
        const prov = settings.provider || {};
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const rawProxy = String(prov.proxyBase || '').trim().replace(/\/+$/, '');
        const isDirect = !rawProxy || (!isLocal && (rawProxy === '/proxy' || rawProxy === 'direct'));
        const url = isDirect
          ? 'https://text.novelai.net/oa/v1/completions'
          : `${rawProxy || '/proxy'}/text/oa/v1/completions`;
        const headers = { 'Content-Type': 'application/json' };
        const override = String(prov.apiKey || '').trim();
        // Ignore legacy values where the old combined field saved a URL into apiKey.
        if (override && !/^https?:\/\//i.test(override)) {
          headers.Authorization = 'Bearer ' + override.replace(/^Bearer\s+/i, '');
        } else if (isDirect) {
          throw new Error('NovelAI API token is required. Por favor ve a Ajustes (icono de engranaje) y escribe tu API Token de NovelAI.');
        }

        let debug = false;
        try { debug = localStorage.getItem('debugPrompt') === '1'; } catch (e) { /* storage blocked */ }
        if (debug) {
          const { prompt, ...params } = req.payload;
          console.groupCollapsed(`[AetherWeaver] NovelAI request (${params.model}, ~${req.stats.estimatedPromptTokens} prompt tokens)`);
          console.log('URL:', url, '| token override:', Boolean(headers.Authorization));
          console.log('Parameters:', params);
          console.log('Budget:', req.stats);
          console.log('Prompt:\n' + prompt);
          console.groupEnd();
        }

        // --- Output pipeline: strip leading space, enforce stops client-side, hold back partial stops
        const prefix = req.isContinue ? continueFrom : req.seed; // visible text before generated text
        const stripLeading = !prefix || /\s$/.test(prefix);
        const stops = req.stops;
        const maxStop = stops.reduce((m, s) => Math.max(m, s.length), 0);
        let raw = '';
        let gen = '';
        let sent = 0;
        let hitStop = false;
        const emit = (chunk) => { if (chunk && typeof onToken === 'function') onToken(chunk); };
        const feed = (delta, final) => {
          if (hitStop) return true;
          raw += delta;
          gen = stripLeading ? raw.replace(/^\s+/, '') : raw;
          let cut = -1;
          const from = Math.max(0, sent - maxStop);
          for (const s of stops) {
            const i = gen.indexOf(s, from);
            if (i !== -1 && (cut === -1 || i < cut)) cut = i;
          }
          if (cut !== -1) { gen = gen.slice(0, cut); hitStop = true; }
          const safe = (hitStop || final) ? gen.length : gen.length - this.partialStopSuffix(gen, stops);
          if (safe > sent) { emit(gen.slice(sent, safe)); sent = safe; }
          return hitStop;
        };

        const ctrl = new AbortController();
        const relayAbort = () => ctrl.abort();
        if (signal) signal.addEventListener('abort', relayAbort, { once: true });

        const abortError = () => {
          const e = new DOMException('Generation aborted', 'AbortError');
          e.partialText = prefix + gen.slice(0, sent);
          return e;
        };
        const post = async (stream) => {
          try {
            return await fetch(url, {
              method: 'POST',
              headers: { ...headers, Accept: stream ? 'text/event-stream, application/json' : 'application/json' },
              body: JSON.stringify({ ...req.payload, stream }),
              signal: ctrl.signal
            });
          } catch (err) {
            if (signal && signal.aborted) throw abortError();
            if (isDirect) {
              throw new Error(`No se pudo conectar directamente con NovelAI (${err.message}). Revisa tu conexión a internet o verifica tu API Token en Ajustes.`);
            }
            throw new Error(`Could not reach the proxy at "${rawProxy || '/proxy'}". Is "node proxy.mjs" running, and is the app opened from the proxy's address? (${err.message})`);
          }
        };
        const simulate = async (text) => {
          const chunks = text.match(/\s*\S+\s*/g) || (text ? [text] : []);
          for (const c of chunks) {
            if (signal && signal.aborted) throw abortError();
            if (feed(c, false)) break;
            await new Promise(r => setTimeout(r, 16));
          }
        };

        try {

    const ImageStore = {
      _db: null,
      _cache: new Map(), // key -> objectUrl (blob:...) or dataUrl
      _initPromise: null,

      init() {
        if (this._initPromise) return this._initPromise;
        this._initPromise = new Promise((resolve) => {
          if (!window.indexedDB) {
            console.warn('[ImageStore] IndexedDB not available, using in-memory store.');
            return resolve();
          }
          try {
            const req = indexedDB.open('aetherweaver_assets_v1', 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('images')) {
                db.createObjectStore('images');
              }
            };
            req.onsuccess = (e) => {
              this._db = e.target.result;
              resolve();
            };
            req.onerror = () => {
              console.warn('[ImageStore] IndexedDB failed to open, using in-memory fallback.');
              resolve();
            };
          } catch (e) {
            console.warn('[ImageStore] Error opening IndexedDB:', e);
            resolve();
          }
        });
        return this._initPromise;
      },

      async save(key, blobOrDataUrl) {
        if (!key) return null;
        await this.init();
        let blob = blobOrDataUrl;
        if (typeof blobOrDataUrl === 'string' && blobOrDataUrl.startsWith('data:')) {
          blob = this._dataUrlToBlob(blobOrDataUrl);
        }
        if (blob instanceof Blob) {
          const objectUrl = URL.createObjectURL(blob);
          this._cache.set(key, objectUrl);
        } else if (typeof blobOrDataUrl === 'string') {
          this._cache.set(key, blobOrDataUrl);
        }

        if (this._db) {
          try {
            await new Promise((resolve, reject) => {
              const tx = this._db.transaction('images', 'readwrite');
              tx.oncomplete = () => resolve();
              tx.onerror = () => reject(tx.error);
              tx.objectStore('images').put(blob, key);
            });
          } catch (e) {
            console.warn('[ImageStore] Failed to persist image to IndexedDB:', e);
          }
        }
        return 'idb:' + key;
      },

      async get(key) {
        if (this._cache.has(key)) return this._cache.get(key);
        await this.init();
        if (!this._db) return null;
        return new Promise((resolve) => {
          try {
            const tx = this._db.transaction('images', 'readonly');
            const req = tx.objectStore('images').get(key);
            req.onsuccess = () => {
              const val = req.result;
              if (val instanceof Blob) {
                const url = URL.createObjectURL(val);
                this._cache.set(key, url);
                resolve(url);
              } else if (typeof val === 'string') {
                this._cache.set(key, val);
                resolve(val);
              } else {
                resolve(null);
              }
            };
            req.onerror = () => resolve(null);
          } catch {
            resolve(null);
          }
        });
      },

      async getAsDataUrl(key) {
        const cached = this._cache.get(key);
        if (typeof cached === 'string' && cached.startsWith('data:')) return cached;
        await this.init();
        if (!this._db) return cached || '';
        return new Promise((resolve) => {
          try {
            const tx = this._db.transaction('images', 'readonly');
            const req = tx.objectStore('images').get(key);
            req.onsuccess = () => {
              const val = req.result;
              if (val instanceof Blob) {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.onerror = () => resolve('');
                reader.readAsDataURL(val);
              } else if (typeof val === 'string') {
                resolve(val);
              } else {
                resolve('');
              }
            };
            req.onerror = () => resolve('');
          } catch {
            resolve('');
          }
        });
      },

      resolveUrl(val) {
        if (!val || typeof val !== 'string') return '';
        if (val.startsWith('idb:')) {
          const key = val.slice(4);
          if (this._cache.has(key)) return this._cache.get(key);
          this.get(key).then(loadedUrl => {
            if (loadedUrl) {
              document.querySelectorAll(`img[data-idb-key="${escapeHtml(key)}"]`).forEach(img => {
                img.src = loadedUrl;
              });
            }
          });
          return '';
        }
        return val;
      },

      async preloadAll(chats, characters, personas) {
        await this.init();
        if (!this._db) return;
        const keysToFetch = new Set();
        const checkVal = (v) => {
          if (typeof v === 'string' && v.startsWith('idb:')) {
            const k = v.slice(4);
            if (!this._cache.has(k)) keysToFetch.add(k);
          }
        };

        (chats || []).forEach(c => c.messages?.forEach(m => m.alternatives?.forEach(a => checkVal(a.imageUrl))));
        (characters || []).forEach(c => checkVal(c.avatar));
        (personas || []).forEach(p => checkVal(p.avatar));

        if (keysToFetch.size === 0) return;
        await Promise.all(Array.from(keysToFetch).map(k => this.get(k)));
      },

      async migrateLocalStorage() {
        try {
          const chats = Storage.getChats();
          let chatsChanged = false;
          for (const chat of chats) {
            for (const msg of (chat.messages || [])) {
              for (const alt of (msg.alternatives || [])) {
                if (alt.imageLoading) {
                  alt.imageLoading = false;
                  chatsChanged = true;
                }
                if (alt.imageUrl && typeof alt.imageUrl === 'string' && alt.imageUrl.startsWith('data:image/') && alt.imageUrl.length > 1000) {
                  const key = 'migrated_scene_' + Math.random().toString(36).slice(2, 9);
                  await this.save(key, alt.imageUrl);
                  alt.imageUrl = 'idb:' + key;
                  chatsChanged = true;
                }
              }
            }
          }
          if (chatsChanged) {
            Storage.saveChats(chats);
            console.log('[ImageStore] Migrated chat images to IndexedDB and cleared stuck loading flags.');
          }

          const chars = Storage.getCharacters();
          let charsChanged = false;
          for (const char of chars) {
            if (char.avatar && typeof char.avatar === 'string' && char.avatar.startsWith('data:image/') && char.avatar.length > 2000) {
              const key = 'migrated_avatar_' + Math.random().toString(36).slice(2, 9);
              await this.save(key, char.avatar);
              char.avatar = 'idb:' + key;
              charsChanged = true;
            }
          }
          if (charsChanged) {
            Storage.saveCharacters(chars);
            console.log('[ImageStore] Migrated character avatars to IndexedDB.');
          }
        } catch (e) {
          console.warn('[ImageStore] Storage migration warning:', e);
        }
      },

      async exportAll() {
        await this.init();
        if (!this._db) return {};
        return new Promise((resolve) => {
          try {
            const tx = this._db.transaction('images', 'readonly');
            const store = tx.objectStore('images');
            const req = store.getAllKeys();
            req.onsuccess = async () => {
              const keys = req.result || [];
              const out = {};
              for (const k of keys) {
                out[k] = await this.getAsDataUrl(k);
              }
              resolve(out);
            };
            req.onerror = () => resolve({});
          } catch {
            resolve({});
          }
        });
      },

      async importAll(imagesMap) {
        if (!imagesMap || typeof imagesMap !== 'object') return;
        await this.init();
        for (const [key, dataUrl] of Object.entries(imagesMap)) {
          if (dataUrl && typeof dataUrl === 'string') {

      },

      _dataUrlToBlob(dataUrl) {
        try {
          const arr = dataUrl.split(',');
          const mime = arr[0].match(/:(.*?);/)?.[1] || 'image/png';
          const bstr = atob(arr[1]);
          let n = bstr.length;
          const u8arr = new Uint8Array(n);
          while (n--) u8arr[n] = bstr.charCodeAt(n);
          return new Blob([u8arr], { type: mime });
        } catch {
          return null;
        }
      }
