<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131624"/>
      <stop offset="50%" stop-color="#1d183b"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9175ff"/>
      <stop offset="55%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#00d2b4"/>
    </linearGradient>
  </defs>

  <!-- Maskable safe-zone background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle outer ring inside maskable safe zone (r <= 204) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-opacity="0.35"/>

  <!-- Stylized 'A' + Chat Quill Monogram -->
  <path d="M168 356 L256 144 L344 356" fill="none" stroke="url(#accentGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 292 H314" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>

  <!-- Sparkle / Star Node at Apex -->
  <circle cx="256" cy="144" r="18" fill="#00d2b4"/>
</svg>
