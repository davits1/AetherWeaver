<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="medium" data-density="comfortable">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AetherWeaver — Roleplay & Character Studio</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    /* ==========================================================================
       CSS VARIABLES & THEME TOKENS
       ========================================================================== */
    :root,
    [data-theme="dark"] {
      --bg-base: #0b0d12;
      --bg-surface: #13161f;
      --bg-elevated: #1c202d;
      --bg-elevated-hover: #252a3a;
      --bg-glass: rgba(19, 22, 31, 0.85);
      --border: #262b3d;
      --border-focus: #7c5cff;
      --text-primary: #f1f3f9;
      --text-secondary: #9ba3b8;
      --text-muted: #646d85;
      --accent: #7c5cff;
      --accent-hover: #9175ff;
      --accent-soft: rgba(124, 92, 255, 0.16);
      --accent-secondary: #00d2b4;
      --danger: #f04b62;
      --danger-soft: rgba(240, 75, 98, 0.16);
      --success: #2dd4bf;
      --warning: #f59e0b;
      --bubble-user: #2b2452;
      --bubble-user-border: #433780;
      --bubble-char: #171b26;
      --bubble-char-border: #262b3d;
      --rp-action: #b69eff;
      --rp-quote: #ffffff;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    [data-theme="light"] {
      --bg-base: #f4f6fb;
      --bg-surface: #ffffff;
      --bg-elevated: #edf0f7;
      --bg-elevated-hover: #e2e7f2;
      --bg-glass: rgba(255, 255, 255, 0.88);
      --border: #d8deeb;
      --border-focus: #6342e8;
      --text-primary: #141724;
      --text-secondary: #4f5873;
      --text-muted: #7f88a3;
      --accent: #6342e8;
      --accent-hover: #502fd6;
      --accent-soft: rgba(99, 66, 232, 0.12);
      --accent-secondary: #0ca689;
      --danger: #dc2646;
      --danger-soft: rgba(220, 38, 70, 0.12);
      --success: #0d9488;
      --warning: #d97706;
      --bubble-user: #ede9fe;
      --bubble-user-border: #c4b5fd;
      --bubble-char: #ffffff;
      --bubble-char-border: #d8deeb;
      --rp-action: #5b21b6;
      --rp-quote: #111827;
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 12px 28px rgba(15, 23, 42, 0.15);
    }

    [data-font="small"] {
      --font-scale: 0.9rem;
      --msg-line-height: 1.45;
    }

    [data-font="medium"] {
      --font-scale: 1rem;
      --msg-line-height: 1.55;
    }

    [data-font="large"] {
      --font-scale: 1.125rem;
      --msg-line-height: 1.65;
    }

    [data-density="compact"] {
      --msg-gap: 0.5rem;
      --msg-pad: 0.65rem 0.9rem;
    }

    [data-density="comfortable"] {
      --msg-gap: 1rem;
      --msg-pad: 0.9rem 1.15rem;
    }

    [data-density="spacious"] {
      --msg-gap: 1.4rem;
      --msg-pad: 1.15rem 1.35rem;
    }

    /* ==========================================================================
       RESET & BASE LAYOUT
       ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
      background: none;
      border: none;
    }

    button {
      cursor: pointer;
      user-select: none;
    }

    :focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ==========================================================================
       APP SHELL (SIDEBAR + MAIN + BOTTOM NAV)
       ========================================================================== */
    #app-shell {
      display: flex;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Desktop Left Sidebar */
    #sidebar {
      width: 270px;
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 20;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      cursor: pointer;
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.75rem;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-height: 44px;
      padding: 0.6rem 0.85rem;
      border-radius: 10px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
      text-align: left;
    }

    .nav-btn:hover {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .nav-btn.active {
      background-color: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .sidebar-section-title {
      padding: 0.75rem 1.15rem 0.35rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .sidebar-recents {
      flex: 1;
      overflow-y: auto;
      padding: 0.25rem 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .recent-sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.45rem 0.65rem;
      min-height: 44px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .recent-sidebar-item:hover,
    .recent-sidebar-item.active {
      background-color: var(--bg-elevated);
    }

    .recent-sidebar-item .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--bg-elevated);
    }

    .recent-sidebar-info {
      flex: 1;
      min-width: 0;
    }

    .recent-sidebar-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-sidebar-preview {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-footer {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      background: var(--bg-surface);
    }

    .persona-pill {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 44px;
      padding: 0.35rem 0.6rem;
      border-radius: 10px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
      transition: background 0.15s;
    }

    .persona-pill:hover {
      background: var(--bg-elevated);
    }

    /* Main Workspace Area */
    #main-view {
      flex: 1;
      height: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background-color: var(--bg-base);
    }

    .screen-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.5rem;
      padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
    }

    .container-wide {
      max-width: 1180px;
      margin: 0 auto;
      width: 100%;
    }

    .container-narrow {
      max-width: 840px;
      margin: 0 auto;
      width: 100%;
    }

    /* Mobile Bottom Navigation Bar */
    #bottom-nav {
      display: none;
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 30;
    }

    .bottom-nav-inner {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 58px;
    }

    .bottom-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      flex: 1;
      height: 100%;
      min-height: 44px;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 500;
    }

    .bottom-nav-btn svg {
      width: 22px;
      height: 22px;
    }

    .bottom-nav-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* ==========================================================================
       COMMON UI COMPONENTS (BUTTONS, INPUTS, CHIPS, CARDS)
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 44px;
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background-color: var(--bg-elevated-hover);
    }

    .btn-danger {
      background-color: var(--danger-soft);
      color: var(--danger);
      border: 1px solid rgba(240, 75, 98, 0.3);
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    .input-field,
    .textarea-field,
    .select-field {
      width: 100%;
      min-height: 44px;
      padding: 0.65rem 0.9rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      transition: border-color 0.15s;
    }

    .textarea-field {
      resize: vertical;
      min-height: 90px;
      line-height: 1.5;
    }

    .input-field:focus,
    .textarea-field:focus,
    .select-field:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.1rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Top Bar for Mobile / Sub-screens */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      min-height: 60px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar-title {
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================================
       SCREEN 1: HOME / DISCOVER
       ========================================================================== */
    .discover-hero {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .search-bar-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-bar-wrap svg {
      position: absolute;
      left: 1rem;
      width: 20px;
      height: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 2.8rem 0.75rem 2.85rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-size: 0.98rem;
      box-shadow: var(--shadow-sm);
    }

    .search-clear-btn {
      position: absolute;
      right: 0.4rem;
    }

    .chip-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.86rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .chip:hover {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .chip.active {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0 0.85rem;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Recent Chats Horizontal Row */
    .recents-row {
      display: flex;
      gap: 0.85rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .recent-card {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 240px;
      max-width: 280px;
      padding: 0.75rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }

    .recent-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .recent-card img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    /* Character Cards Grid */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
      gap: 1rem;
    }

    .char-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      position: relative;
    }

    .char-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .char-card-top {
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
    }

    .char-avatar-lg {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .char-card-meta {
      flex: 1;
      min-width: 0;
    }

    .char-card-name {
      font-size: 1.02rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.15rem;
    }

    .char-card-creator {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }

    .char-card-tagline {
      font-size: 0.85rem;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .char-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .tag-badges {
      display: flex;
      gap: 0.35rem;
      overflow: hidden;
      flex-wrap: nowrap;
    }

    .badge {
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      background-color: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ==========================================================================
       SCREEN 2: CHARACTER PROFILE
       ========================================================================== */
    .profile-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .profile-header {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .profile-avatar {
      width: 112px;
      height: 112px;
      border-radius: 22px;
      object-fit: cover;
      border: 2px solid var(--accent);
      background-color: var(--bg-elevated);
    }

    .profile-title-area {
      flex: 1;
      min-width: 220px;
    }

    .profile-stats {
      display: flex;
      gap: 1.25rem;
      margin-top: 0.65rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .code-box {
      background-color: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-secondary);
      max-height: 300px;
      overflow-y: auto;
    }

    /* ==========================================================================
       SCREEN 3: CHAT VIEW & CONTEXT DRAWER
       ========================================================================== */
    .chat-layout {
      display: flex;
      flex: 1;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .chat-main-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      position: relative;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.85rem;
      min-height: 62px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .chat-header-char {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
      min-width: 0;
      padding: 0.25rem 0.4rem;
      border-radius: 10px;
    }

    .chat-header-char:hover {
      background-color: var(--bg-elevated);
    }

    .chat-header-char img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      position: relative;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 230px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      padding: 0.4rem;
      z-index: 50;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-primary);
      text-align: left;
    }

    .dropdown-item:hover {
      background-color: var(--bg-elevated);
    }

    .dropdown-item.danger {
      color: var(--danger);
    }

    .dropdown-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Message Stream */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: var(--msg-gap);
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      gap: 0.75rem;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      align-items: flex-start;
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-top: 0.15rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
    }

    .msg-content-wrap {
      display: flex;
      flex-direction: column;
      max-width: calc(100% - 52px);
      min-width: 180px;
    }

    .msg-row.user .msg-content-wrap {
      align-items: flex-end;
    }

    .msg-sender-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 0 0.2rem;
    }

    .msg-sender-name {
      font-weight: 600;
      color: var(--text-secondary);
    }

    .msg-bubble {
      padding: var(--msg-pad);
      border-radius: 16px;
      font-size: var(--font-scale);
      line-height: var(--msg-line-height);
      background-color: var(--bubble-char);
      border: 1px solid var(--bubble-char-border);
      color: var(--text-primary);
      word-wrap: break-word;
      overflow-wrap: break-word;
      width: 100%;
    }

    .msg-row.user .msg-bubble {
      background-color: var(--bubble-user);
      border-color: var(--bubble-user-border);
      border-top-right-radius: 4px;
    }

    .msg-row.char .msg-bubble {
      border-top-left-radius: 4px;
    }

    /* Roleplay Formatting inside Message Bubbles */
    .msg-bubble p {
      margin-bottom: 0.65rem;
    }

    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .rp-action {
      font-style: italic;
      color: var(--rp-action);
    }

    .rp-quote {
      color: var(--rp-quote);
    }

    .msg-bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: rgba(0, 0, 0, 0.25);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.88em;
    }

    .msg-bubble pre {
      background: rgba(0, 0, 0, 0.35);
      padding: 0.75rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5rem 0;
    }

    /* Image Attachment in Message */
    .msg-image-card {
      margin-top: 0.75rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: var(--bg-base);
      max-width: 360px;
    }

    .msg-image-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .msg-image-meta {
      padding: 0.55rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .msg-image-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .mini-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      min-height: 36px;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .mini-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }

    /* Per-Message Action Bar & Swipe Controls */
    .msg-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.3rem;
      width: 100%;
    }

    .swipe-bar {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.1rem 0.25rem;
    }

    .swipe-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text-secondary);
    }

    .swipe-btn:hover:not(:disabled) {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .swipe-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .swipe-count {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0 0.35rem;
      color: var(--text-secondary);
    }

    .msg-actions-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.1rem;
    }

    .msg-act-btn {
      min-width: 38px;
      min-height: 38px;
      padding: 0.3rem 0.45rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      color: var(--text-muted);
      font-size: 0.74rem;
      transition: background 0.15s, color 0.15s;
    }

    .msg-act-btn:hover {
      background-color: var(--bg-elevated);
      color: var(--text-primary);
    }

    .msg-act-btn svg {
      width: 15px;
      height: 15px;
    }

    /* Typing & Skeleton Loading */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0.3rem 0.2rem;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
      animation: bounce 1.3s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .skeleton-box {
      width: 100%;
      height: 220px;
      background: linear-gradient(90deg, var(--bg-elevated) 25%, var(--bg-elevated-hover) 50%, var(--bg-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* Chat Composer & Suggested Replies */
    .chat-composer-wrap {
      background-color: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 0.65rem 1rem calc(0.65rem + env(safe-area-inset-bottom, 0px));
      flex-shrink: 0;
    }

    .chat-composer-inner {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .suggestions-bar {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
      scrollbar-width: none;
    }

    .suggestions-bar::-webkit-scrollbar {
      display: none;
    }

    .suggestion-pill {
      padding: 0.4rem 0.8rem;
      min-height: 38px;
      border-radius: 999px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: all 0.15s;
    }

    .suggestion-pill:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 0.45rem;
    }

    #chat-input {
      flex: 1;
      min-height: 44px;
      max-height: 150px;
      padding: 0.65rem 0.9rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      resize: none;
      line-height: 1.45;
      overflow-y: auto;
    }

    #chat-input:focus {
      outline: none;
      border-color: var(--border-focus);
    }

    /* Right Collapsible Context Panel (NovelAI Memory / Author's Note / Lorebook) */
    #context-drawer {
      width: 350px;
      flex-shrink: 0;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 25;
      transition: transform 0.22s ease;
    }

    #context-drawer.hidden {
      display: none;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      min-height: 62px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .lorebook-entry-card {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    /* ==========================================================================
       MODALS, DIALOGS, TOASTS
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }

    .modal-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    .modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
    }

    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
    }

    .modal-footer {
      padding: 0.85rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    #toast-container {
      position: fixed;
      bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
      right: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 120;
      max-width: calc(100vw - 2.5rem);
    }

    .toast {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      min-width: 260px;
      font-size: 0.88rem;
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.success {
      border-left-color: var(--success);
    }

    /* ==========================================================================
       FORMS, COLLAPSIBLE PANELS, GRIDS
       ========================================================================== */
    .two-col-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    details.collapsible-panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    details.collapsible-panel>summary {
      padding: 1rem 1.25rem;
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      background-color: var(--bg-elevated);
    }

    details.collapsible-panel>summary::-webkit-details-marker {
      display: none;
    }

    .panel-content {
      padding: 1.25rem;
    }

    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 6px;
      background: var(--bg-elevated);
      border-radius: 4px;
      cursor: pointer;
    }

    /* Toggle Switch */
    .switch-label {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      min-height: 44px;
    }

    .switch-input {
      appearance: none;
      width: 44px;
      height: 24px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .switch-input::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--text-secondary);
      transition: transform 0.15s, background 0.15s;
    }

    .switch-input:checked {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .switch-input:checked::after {
      transform: translateX(20px);
      background-color: #ffffff;
    }

    /* ==========================================================================
       RESPONSIVE BREAKPOINTS (MOBILE <= 840px)
       ========================================================================== */
    @media (max-width: 840px) {
      #sidebar {
        display: none;
      }

      #bottom-nav {
        display: block;
      }

      body.in-chat #bottom-nav {
        display: none;
      }

      .screen-scroll {
        padding: 1rem;
      }

      .two-col-grid {
        grid-template-columns: 1fr;
      }

      .char-grid {
        grid-template-columns: 1fr;
      }

      /* Context Drawer becomes a bottom sheet on mobile */
      #context-drawer {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 82dvh;
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        box-shadow: var(--shadow-lg);
        z-index: 80;
      }

      #toast-container {
        bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px));
        left: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>

<body>
  <div id="app-shell">
    <!-- Left Sidebar (Desktop) -->
    <aside id="sidebar" aria-label="Main Navigation"></aside>

    <!-- Main Dynamic View -->
    <main id="main-view" role="main"></main>

    <!-- Bottom Navigation (Mobile) -->
    <nav id="bottom-nav" aria-label="Mobile Navigation"></nav>
  </div>

  <!-- Modal & Toast Containers -->
  <div id="modal-root"></div>
  <div id="toast-container" aria-live="polite"></div>

  <!-- Hidden File Input for Imports -->
  <input type="file" id="global-file-input" accept=".json,application/json" style="display:none">

  <script>
    /**
     * ============================================================================
     * 1. DATA SHAPES (JSDoc Reference for Integration Agents)
     * ============================================================================
     *
     * @typedef {Object} Character
     * @property {string} id - Unique identifier (e.g., "char_1")
     * @property {string} name - Display name of the character
     * @property {string} tagline - Short 1-line hook shown on cards
     * @property {string} description - Long definition / personality / lore
     * @property {string} greeting - Initial message when starting a new chat
     * @property {string} exampleDialogue - Example message exchanges (`{{char}}: ...`)
     * @property {string} avatar - Data URI or URL for avatar image
     * @property {string[]} tags - Category/genre tags (e.g., ["Sci-Fi", "Original"])
     * @property {string} creator - Handle of creator (e.g., "@you" or "@aether")
     * @property {number} chatCount - Cosmetic interaction counter
     * @property {'public'|'unlisted'|'private'} visibility - Cosmetic visibility state
     * @property {number} updatedAt - Epoch timestamp (ms)
     *
     * @typedef {Object} MessageAlternative
     * @property {string} text - Markdown/roleplay text content
     * @property {string} [imageUrl] - Optional attached/generated image URL or data URI
     * @property {string} [imagePrompt] - Prompt used to generate the image
     * @property {boolean} [imageLoading] - True while image is generating
     * @property {number} createdAt - Epoch timestamp (ms)
     *
     * @typedef {Object} Message
     * @property {string} id - Unique identifier
     * @property {'user'|'char'} role - Sender role
     * @property {MessageAlternative[]} alternatives - Swipeable message versions
     * @property {number} selectedIndex - Active index in `alternatives`
     *
     * @typedef {Object} LorebookEntry
     * @property {string} id - Unique identifier
     * @property {string} name - Entry label
     * @property {string[]} keywords - Trigger keys (comma-separated in UI)
     * @property {string} text - Lore content injected when triggered
     * @property {boolean} enabled - Active toggle
     *
     * @typedef {Object} Chat
     * @property {string} id - Unique identifier
     * @property {string} characterId - Associated character ID
     * @property {string} title - Chat session name
     * @property {Message[]} messages - Ordered message history
     * @property {string} memory - Per-chat NovelAI-style Memory text
     * @property {string} authorsNote - Per-chat NovelAI-style Author's Note
     * @property {LorebookEntry[]} lorebook - Per-chat Lorebook entries
     * @property {number} updatedAt - Epoch timestamp (ms)
     *
     * @typedef {Object} Persona
     * @property {string} id - Unique identifier
     * @property {string} name - User's in-roleplay name
     * @property {string} description - User appearance/background details
     * @property {string} avatar - Data URI or URL
     *
     * @typedef {Object} Settings
     * @property {'dark'|'light'} theme
     * @property {'small'|'medium'|'large'} fontSize
     * @property {'compact'|'comfortable'|'spacious'} density
     * @property {boolean} showSuggestions - Toggle suggested replies bar in chat
     * @property {number} creativity - Simple slider (0.1 to 1.5)
     * @property {'short'|'medium'|'long'} responseLength - Simple length preset
     * @property {Object} advancedText
     * @property {number} advancedText.temperature
     * @property {number} advancedText.topP
     * @property {number} advancedText.topK
     * @property {number} advancedText.minP
     * @property {number} advancedText.maxTokens
     * @property {number} advancedText.repetitionPenalty
     * @property {string[]} advancedText.stopSequences
     * @property {string} advancedText.systemPromptOverride
     * @property {Object} imageGen
     * @property {'portrait'|'landscape'|'square'} imageGen.sizePreset
     * @property {string} imageGen.negativePrompt
     * @property {number} imageGen.seed - (-1 for random)
     * @property {number} imageGen.steps
     * @property {number} imageGen.guidance
     * @property {string} imageGen.sampler
     * @property {string} imageGen.stylePrefix
     * @property {Object} provider
     * @property {'mock'|'novelai'|'local'} provider.type
     * @property {string} provider.apiKey
     * @property {string} provider.baseUrl
     */

    /* Helper to create vivid deterministic SVG data URI avatars offline */
    function makeSvgAvatar(initials, bg1, bg2, shapeType = 'circle') {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="${bg1}"/>
            <stop offset="100%" stop-color="${bg2}"/>
          </linearGradient>
        </defs>
        <rect width="160" height="160" fill="url(#g)"/>
        ${shapeType === 'diamond'
          ? '<polygon points="80,14 146,80 80,146 14,80" fill="rgba(255,255,255,0.1)" />'
          : '<circle cx="80" cy="80" r="56" fill="rgba(255,255,255,0.1)"/>'}
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
              fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="52">${initials}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function makeSceneSvg(prompt, characterName, sizePreset = 'portrait') {
      const dims = sizePreset === 'landscape' ? [640, 420] : sizePreset === 'square' ? [512, 512] : [440, 600];
      const hash = Array.from(prompt + characterName).reduce((a, c) => ((a << 5) - a) + c.charCodeAt(0), 0);
      const hue1 = Math.abs(hash) % 360;
      const hue2 = (hue1 + 65) % 360;
      const safePrompt = (prompt || 'Atmospheric portrait').replace(/[<>&"]/g, '').slice(0, 55);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dims[0]} ${dims[1]}">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="hsl(${hue1}, 65%, 22%)"/>
            <stop offset="55%" stop-color="hsl(${hue2}, 60%, 15%)"/>
            <stop offset="100%" stop-color="#090b10"/>
          </linearGradient>
          <radialGradient id="glow" cx="50%" cy="38%" r="45%">
            <stop offset="0%" stop-color="hsl(${hue2}, 85%, 65%)" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bg)"/>
        <rect width="100%" height="100%" fill="url(#glow)"/>
        <circle cx="${dims[0] * 0.5}" cy="${dims[1] * 0.36}" r="${Math.min(dims[0], dims[1]) * 0.18}" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>

    /**
     * ============================================================================
     * 2. INTEGRATION LAYER (External API Stubs — Replace Here Later)
     * ============================================================================
     * The UI NEVER calls `fetch` directly. All external operations go through `API`.

    const API = {
      /**
       * Lists characters filtered by search query and category tag.
       * @param {string} [query=""]
       * @param {string} [category="All"]
       * @returns {Promise<Character[]>}
       */
      async listCharacters(query = '', category = 'All') {
        await new Promise(r => setTimeout(r, 80));
        const all = Storage.getCharacters();
        const q = query.trim().toLowerCase();
        return all.filter(c => {
          const matchesCat = !category || category === 'All' || (c.tags && c.tags.includes(category));
          const matchesQuery = !q ||
            c.name.toLowerCase().includes(q) ||
            c.tagline.toLowerCase().includes(q) ||
            c.description.toLowerCase().includes(q) ||
            (c.tags && c.tags.some(t => t.toLowerCase().includes(q)));
          return matchesCat && matchesQuery;
        });
      },

      /**
       * Retrieves a single character by ID.
       * @param {string} id
       * @returns {Promise<Character|null>}
       */
      async getCharacter(id) {
        await new Promise(r => setTimeout(r, 40));
        return Storage.getCharacters().find(c => c.id === id) || null;
      },

      /**
       * Creates or updates a character in persistent storage.
       * @param {Character} character
       * @returns {Promise<Character>}
       */
      async saveCharacter(character) {
        await new Promise(r => setTimeout(r, 120));
        const chars = Storage.getCharacters();
        const now = Date.now();
        const isSeed = typeof isSeedCharacter === 'function' && isSeedCharacter(character.id);
        const saved = {
          ...character,
          id: (!character.id || isSeed) ? ('char_' + now + '_' + Math.random().toString(36).slice(2, 6)) : character.id,
          creator: isSeed ? '@you' : (character.creator || '@you'),
          isCustom: true,
          updatedAt: now,
          chatCount: typeof character.chatCount === 'number' ? character.chatCount : 1
        };
        const idx = chars.findIndex(c => c.id === saved.id);
        if (idx >= 0) chars[idx] = saved;
        else chars.unshift(saved);
        Storage.saveCharacters(chars);
        return saved;
      },

      /**
       * Generates a streaming character reply (or continuation).
       * Respects `signal` (AbortSignal) for immediate cancellation and invokes `onToken(chunk)`.
       *
       * @param {Object} params
       * @param {Character} params.character
       * @param {Persona} params.persona
       * @param {Message[]} params.messages
       * @param {string} params.memory
       * @param {string} params.authorsNote
       * @param {LorebookEntry[]} params.lorebookEntries
       * @param {Settings} params.settings
       * @param {AbortSignal} [params.signal]
       * @param {function(string): void} [params.onToken]
       * @param {string} [params.continueFrom] - Optional partial string when user clicks "Continue"
       * @returns {Promise<string>} Complete generated text
       */
      async generateReply({
        character,
        persona,
        messages,
        memory,
        authorsNote,
        lorebookEntries,
        settings,
        signal,
        onToken,
        continueFrom = ''
      }) {
        if (signal && signal.aborted) {
          throw new DOMException('Generation aborted', 'AbortError');
        }

        // Find last user message to make mock response context-aware
        const lastUserMsg = [...messages].reverse().find(m => m.role === 'user');
        const userText = lastUserMsg
          ? (lastUserMsg.alternatives[lastUserMsg.selectedIndex]?.text || '')
          : '';

        // Check if any enabled lorebook entry keyword is triggered in recent text
        const activeLore = (lorebookEntries || []).filter(e =>
          e.enabled && e.keywords.some(k => k && userText.toLowerCase().includes(k.toLowerCase()))
        );

        const personaName = persona?.name || 'Traveler';
        let mockReply = '';

        if (continueFrom) {
          const continuations = [
            ` *${character.name} pauses for a heartbeat, eyes narrowing as the silence stretches between them.* "There's more to it than what's written on the surface, ${personaName}. Tell me what you're really thinking before we take the next step."`,
            ` *A faint smile tugs at the corner of ${character.name}'s lips before turning back toward the horizon.* "If we're committing to this course, there's no turning back now."`,
            ` *The ambient hum in the room seems to sharpen for a brief second.* "Actually—wait. Did you hear that just now, or is my paranoia finally catching up with me?"`
          ];
          mockReply = continuations[Math.floor(Math.random() * continuations.length)];
        } else {
          const snippets = [
            `*${character.name} regards ${personaName} with a measured, unhurried gaze, taking in every word.* "${userText ? 'You mention ' + userText.slice(0, 42).replace(/[*"]/g, '').trim() + '...' : 'So, we finally have a moment to speak.'} That changes our calculus considerably." *A subtle shift in posture betrays heightened attention.* "How do you propose we handle the fallout?"`,
            `*Leaning against the nearest surface, ${character.name} lets out a quiet, dry chuckle.* "Bold way to put it, ${personaName}." *Fingers tap a slow rhythm while weighing the options.* "I've seen plenty of people try the direct approach, and only a handful walked away with what they wanted. Let's see if you're one of them."`,
            `*${character.name}'s expression softens just a fraction, though the sharp intensity in their eyes remains.* "Right then, ${personaName}. Let's strip away the pleasantries and get straight to the core of it." *They step closer, lowering their voice.* "What's your next move?"`
          ];
          mockReply = snippets[Math.floor(Math.random() * snippets.length)];

          if (activeLore.length > 0) {
            mockReply += `\n\n*A flicker of recognition crosses ${character.name}'s face regarding ${activeLore[0].name}.* "And considering what we know about ${activeLore[0].keywords[0]}—we'd better tread carefully."`;
          }
          if (authorsNote && authorsNote.trim().length > 0) {
            mockReply += ` *The atmosphere carries the distinct undertone of ${authorsNote.trim().slice(0, 45)}.*`;
          }
        }

        // Adjust verbosity by settings.responseLength
        if (settings?.responseLength === 'short' && !continueFrom) {
          mockReply = mockReply.split('\n\n')[0];
        } else if (settings?.responseLength === 'long' && !continueFrom) {
          mockReply += `\n\n*${character.name} glances around once more, ensuring no one else is within earshot, before gesturing toward the table.* "Take your time answering. Every detail counts from here on out."`;
        }

        // Tokenize and stream
        const tokens = mockReply.match(/\S+\s*/g) || [mockReply];
        let accumulated = continueFrom ? continueFrom : '';

        for (const token of tokens) {
          if (signal && signal.aborted) {
            throw new DOMException('Generation aborted', 'AbortError');
          }
          await new Promise((resolve, reject) => {
            const timer = setTimeout(resolve, 28 + Math.random() * 25);
            if (signal) {
              signal.addEventListener('abort', () => {
                clearTimeout(timer);
                reject(new DOMException('Generation aborted', 'AbortError'));
              }, { once: true });
            }
          });
          accumulated += token;
          if (typeof onToken === 'function') {
            onToken(token);
          }
        }

        return accumulated;
      },

      /**
       * Generates an inline scene image for the chat.
       * @param {Object} params

       * @param {Character} params.character
       * @param {Settings} params.settings
       * @param {AbortSignal} [params.signal]
       * @returns {Promise<string>} Image URL or Data URI

      async generateImage({ prompt, character, settings, signal }) {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(resolve, 950);
          if (signal) {
            signal.addEventListener('abort', () => {
              clearTimeout(timer);
              reject(new DOMException('Image generation aborted', 'AbortError'));
            }, { once: true });
          }
        });
        const preset = settings?.imageGen?.sizePreset || 'portrait';
        return makeSceneSvg(prompt, character?.name || 'Scene', preset);

      async generateAvatar({ character, signal }) {
        await new Promise((resolve, reject) => {

            signal.addEventListener('abort', () => {
              clearTimeout(timer);
              reject(new DOMException('Avatar generation aborted', 'AbortError'));

        const name = (character?.name || 'AI').trim();
        const initials = name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || 'AI';

          ['#0f766e', '#1d4ed8'],
          ['#b45309', '#9333ea'],
          ['#1e293b', '#6366f1']
        ];
        const pick = palette[Math.floor(Math.random() * palette.length)];
        return makeSvgAvatar(initials, pick[0], pick[1], Math.random() > 0.5 ? 'diamond' : 'circle');

            return seed;

          const seedMap = new Map(seedChars.map(c => [c.id, c]));

          seedChars.forEach(seedChar => {

              chars.push(seedChar);
              updated = true;

          });
          chars.forEach(c => {
            const seed = seedMap.get(c.id);
            if (seed && !c.isCustom) {

      getSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEYS.SETTINGS);
          const defaults = getDefaultSettings();
          if (!raw) {
            localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(defaults));
            return defaults;
          }
          const parsed = JSON.parse(raw);
          return {
            ...defaults,
            ...parsed,
            advancedText: { ...defaults.advancedText, ...(parsed.advancedText || {}) },
            imageGen: { ...defaults.imageGen, ...(parsed.imageGen || {}) },
            provider: { ...defaults.provider, ...(parsed.provider || {}) }
          };
        } catch (e) {
          return getDefaultSettings();
        }
      },

        localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(settings));

      exportAllData() {
        return {

        };

      importAllData(payload) {
        if (!payload || typeof payload !== 'object') throw new Error('Invalid backup file format.');
        if (Array.isArray(payload.characters)) this.saveCharacters(payload.characters);
        if (Array.isArray(payload.chats)) this.saveChats(payload.chats);
        if (Array.isArray(payload.personas)) this.savePersonas(payload.personas);
        if (payload.activePersonaId) this.setActivePersonaId(payload.activePersonaId);
        if (payload.settings) this.saveSettings(payload.settings);
      },

        Object.values(STORAGE_KEYS).forEach(k => localStorage.removeItem(k));
      }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Roleplay & Basic Markdown Formatter:
     * - Code blocks ```...``` and inline `...`
     * - **bold**
     * - *italic action text* -> <em class="rp-action">
     * - "quoted speech" -> <span class="rp-quote">
     */
    function formatRoleplayText(raw) {
      if (!raw) return '';
      let safe = escapeHtml(raw);

      // Fenced code blocks
      safe = safe.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
      // Inline code
      safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      // Bold **text**
      safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Roleplay *action* (between single asterisks)
      safe = safe.replace(/\*([^*\n]+)\*/g, '<em class="rp-action">*$1*</em>');
      // Roleplay "dialogue"
      safe = safe.replace(/&quot;([^&]+?)&quot;/g, '<span class="rp-quote">&quot;$1&quot;</span>');

      // Paragraphs
      return safe
        .split(/\n{2,}/)
        .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    function formatCount(num) {
      if (!num) return '0';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    function showToast(message, type = 'info', retryCallback = null) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <div style="display:flex; gap:0.4rem; align-items:center;">
          ${retryCallback ? `<button class="mini-btn toast-retry-btn">Retry</button>` : ''}
          <button class="icon-btn toast-close-btn" style="width:32px;height:32px;" aria-label="Dismiss notification">${Icons.close}</button>
        </div>
      `;
      container.appendChild(toast);

      const remove = () => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      };

      toast.querySelector('.toast-close-btn').addEventListener('click', remove);
      if (retryCallback) {
        toast.querySelector('.toast-retry-btn').addEventListener('click', () => {
          remove();
          retryCallback();
        });
      }
      setTimeout(remove, 5000);
    }

    function renderMessageRow(msg, mIdx, totalMsgs, char, persona) {
      const isUser = msg.role === 'user';
      const senderName = isUser ? persona.name : char.name;
      const senderAvatar = isUser ? persona.avatar : char.avatar;
      const altIndex = Math.min(msg.selectedIndex || 0, msg.alternatives.length - 1);
      const activeAlt = msg.alternatives[altIndex] || { text: '' };
      const isEditing = State.editingMessageId === msg.id;
      const isLastCharMsg = !isUser && mIdx === totalMsgs - 1;

      return `
        <div class="msg-row ${isUser ? 'user' : 'char'}" data-msg-id="${escapeHtml(msg.id)}">
          <img class="msg-avatar" src="${senderAvatar}" alt="${escapeHtml(senderName)}">
          <div class="msg-content-wrap">
            <div class="msg-sender-line">
              <span class="msg-sender-name">${escapeHtml(senderName)}</span>
            </div>

            <div class="msg-bubble">
              ${isEditing ? `
                <div style="display:flex; flex-direction:column; gap:0.5rem;">
                  <textarea class="textarea-field edit-msg-textarea" style="min-height:95px;">${escapeHtml(activeAlt.text)}</textarea>
                  <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
                    <button class="mini-btn" data-action="cancel-edit-msg">Cancel</button>
                    <button class="mini-btn" style="background:var(--accent);color:#fff;border-color:var(--accent);" data-action="save-edit-msg" data-msg-id="${escapeHtml(msg.id)}">Save</button>
                  </div>
                </div>
              ` : `
                <div class="msg-text-body">${activeAlt.text ? formatRoleplayText(activeAlt.text) : (State.isGenerating && isLastCharMsg ? `<div class="typing-dots"><span></span><span></span><span></span></div>` : '')}</div>
              `}

              ${activeAlt.imageLoading ? `
                <div class="msg-image-card">
                  <div class="skeleton-box">Generating visual scene...</div>
                </div>
              ` : ''}

              ${activeAlt.imageUrl && !activeAlt.imageLoading ? `
                <div class="msg-image-card">
                  <img src="${activeAlt.imageUrl}" alt="${escapeHtml(activeAlt.imagePrompt || 'Generated scene')}">
                  <div class="msg-image-meta">
                    <div><strong>Prompt:</strong> ${escapeHtml(activeAlt.imagePrompt || 'Scene illustration')}</div>
                    <div class="msg-image-actions">
                      <button class="mini-btn" data-action="regen-msg-image" data-msg-id="${escapeHtml(msg.id)}">${Icons.refresh} Regenerate</button>
                      <button class="mini-btn" data-action="download-msg-image" data-msg-id="${escapeHtml(msg.id)}">${Icons.download} Save</button>
                      <button class="mini-btn" data-action="use-image-as-avatar" data-msg-id="${escapeHtml(msg.id)}">${Icons.user} Use as Avatar</button>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>

            <!-- Per-Message Action Bar -->
            <div class="msg-toolbar">
              ${!isUser ? `
                <div class="swipe-bar" aria-label="Alternative replies">
                  <button class="swipe-btn" data-action="swipe-prev" data-msg-id="${escapeHtml(msg.id)}" ${altIndex <= 0 || State.isGenerating ? 'disabled' : ''} aria-label="Previous reply alternative">
                    ${Icons.chevLeft}
                  </button>
                  <span class="swipe-count">${altIndex + 1} / ${msg.alternatives.length}</span>
                  <button class="swipe-btn" data-action="swipe-next" data-msg-id="${escapeHtml(msg.id)}" ${State.isGenerating ? 'disabled' : ''} aria-label="Next or generate new reply alternative" title="Next alternative (or generate new)">
                    ${Icons.chevRight}
                  </button>
                </div>
              ` : `<div></div>`}

              <div class="msg-actions-group">
                <button class="msg-act-btn" data-action="copy-msg" data-msg-id="${escapeHtml(msg.id)}" title="Copy text" aria-label="Copy message">${Icons.copy}</button>
                <button class="msg-act-btn" data-action="edit-msg" data-msg-id="${escapeHtml(msg.id)}" title="Edit message" aria-label="Edit message">${Icons.edit}</button>
                <button class="msg-act-btn" data-action="msg-gen-image" data-msg-id="${escapeHtml(msg.id)}" title="Visualize this message" aria-label="Generate image for message">${Icons.image}</button>
                ${!isUser ? `
                  <button class="msg-act-btn" data-action="regen-msg" data-msg-id="${escapeHtml(msg.id)}" title="Regenerate reply" aria-label="Regenerate reply">${Icons.refresh}</button>
                  <button class="msg-act-btn" data-action="continue-msg" data-msg-id="${escapeHtml(msg.id)}" title="Continue message" aria-label="Continue generating from this message">${Icons.fastForward} <span>Continue</span></button>
                ` : ''}
                <button class="msg-act-btn" data-action="rewind-msg" data-msg-id="${escapeHtml(msg.id)}" title="Rewind chat to here" aria-label="Rewind chat to this message">${Icons.rewind}</button>
                <button class="msg-act-btn" data-action="delete-msg" data-msg-id="${escapeHtml(msg.id)}" title="Delete message" aria-label="Delete message">${Icons.trash}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHistoryScreen(main) {
      const allChats = Storage.getChats().sort((a, b) => b.updatedAt - a.updatedAt);
      const chars = Storage.getCharacters();
      const q = State.historySearchQuery.trim().toLowerCase();

      const filtered = allChats.filter(c => {
        if (State.historyFilterCharId && c.characterId !== State.historyFilterCharId) return false;
        if (!q) return true;
        const ch = chars.find(x => x.id === c.characterId);
        const lastMsg = c.messages[c.messages.length - 1];
        const lastText = lastMsg ? (lastMsg.alternatives[lastMsg.selectedIndex]?.text || '') : '';
        return (
          c.title.toLowerCase().includes(q) ||
          (ch && ch.name.toLowerCase().includes(q)) ||
          lastText.toLowerCase().includes(q)
        );
      });

      main.innerHTML = `
        <div class="top-bar">
          <div style="display:flex; align-items:center; gap:0.5rem;">
            ${State.historyFilterCharId ? `<button class="icon-btn" data-action="clear-history-filter" aria-label="Show all characters">${Icons.back}</button>` : ''}
            <div class="top-bar-title">Chat History (${filtered.length})</div>
          </div>
          ${State.historyFilterCharId ? `<button class="btn btn-secondary" data-action="clear-history-filter">Show All Characters</button>` : ''}
        </div>
        <div class="screen-scroll">
          <div class="container-narrow">
            <div class="search-bar-wrap" style="margin-bottom:1.25rem;">
              ${Icons.search}
              <input type="search" id="history-search-input" class="search-input" placeholder="Search saved conversations..." value="${escapeHtml(State.historySearchQuery)}" aria-label="Search chat history">
            </div>

            ${filtered.length === 0 ? `
              <div style="text-align:center; padding:3rem 1rem; background:var(--bg-surface); border:1px solid var(--border); border-radius:16px;">
                <p style="font-weight:600; margin-bottom:0.5rem;">No chat sessions found</p>
                <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">Start a conversation from the Discover screen to see your history here.</p>
                <button class="btn btn-primary" data-action="nav" data-screen="discover">Browse Characters</button>
              </div>
            ` : `
              <div style="display:flex; flex-direction:column; gap:0.75rem;">
                ${filtered.map(chat => {
        const ch = chars.find(x => x.id === chat.characterId) || { name: 'Unknown Character', avatar: makeSvgAvatar('?', '#333', '#111') };
        const lastMsg = chat.messages[chat.messages.length - 1];
        const lastText = lastMsg ? (lastMsg.alternatives[lastMsg.selectedIndex]?.text || '') : '';
        const dateStr = new Date(chat.updatedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `
                    <div class="char-card" style="flex-direction:row; align-items:center; justify-content:space-between; gap:1rem;" data-action="open-chat" data-chat-id="${escapeHtml(chat.id)}" data-char-id="${escapeHtml(ch.id)}">
                      <div style="display:flex; align-items:center; gap:0.85rem; min-width:0; flex:1;">
                        <img src="${ch.avatar}" alt="${escapeHtml(ch.name)}" style="width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;">
                        <div style="min-width:0; flex:1;">
                          <div style="display:flex; align-items:center; gap:0.5rem;">
                            <span style="font-weight:700; font-size:0.98rem;">${escapeHtml(chat.title)}</span>
                            <span class="badge">${escapeHtml(ch.name)}</span>
                          </div>
                          <div style="font-size:0.84rem; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:0.2rem;">
                            ${escapeHtml(lastText.replace(/[*"]/g, '').slice(0, 90))}
                          </div>
                          <div style="font-size:0.74rem; color:var(--text-muted); margin-top:0.25rem;">${chat.messages.length} messages • ${escapeHtml(dateStr)}</div>
                        </div>
                      </div>
                      <div style="display:flex; gap:0.25rem;">
                        <button class="icon-btn" data-action="rename-chat" data-chat-id="${escapeHtml(chat.id)}" aria-label="Rename chat" title="Rename">${Icons.edit}</button>
                        <button class="icon-btn" style="color:var(--danger);" data-action="delete-chat" data-chat-id="${escapeHtml(chat.id)}" aria-label="Delete chat" title="Delete">${Icons.trash}</button>
                      </div>
                    </div>
                  `;
      }).join('')}
              </div>
            `}
          </div>
        </div>
      `;

      const input = document.getElementById('history-search-input');
      if (input) {
        input.addEventListener('input', (e) => {
          State.historySearchQuery = e.target.value;
          renderMainView();
          const el = document.getElementById('history-search-input');
          if (el) {
            el.focus();
            el.setSelectionRange(el.value.length, el.value.length);
          }
        });
      }
    }

    async function renderMainView() {
      applyThemeAndPreferences();
      renderNavigation();
      const main = document.getElementById('main-view');

      switch (State.screen) {
        case 'discover':
          await renderDiscoverScreen(main);
          break;
        case 'profile':
          await renderProfileScreen(main);
          break;
        case 'chat':
          await renderChatScreen(main);
          break;
        case 'history':
          renderHistoryScreen(main);
          break;
        case 'editor':
          await renderEditorScreen(main);
          break;
        case 'personas':
          renderPersonasScreen(main);
          break;
        case 'settings':
          renderSettingsScreen(main);
          break;
        default:
          State.screen = 'discover';
          await renderDiscoverScreen(main);
      }
    }
