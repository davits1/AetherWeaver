    function scrollToChatBottom() {
      const container = document.getElementById('chat-messages');
      if (container) {
        container.scrollTop = container.scrollHeight;
      }
    }

    async function triggerAssistantGeneration({ chat, char, targetMessage = null, continueText = '' }) {
      if (State.isGenerating) return;
      State.isGenerating = true;
      State.abortController = new AbortController();

      const persona = getActivePersona();
      const settings = Storage.getSettings();

      let msgObj = targetMessage;
      if (!msgObj) {
        msgObj = {
          id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          role: 'char',
          selectedIndex: 0,
          alternatives: [{ text: '', createdAt: Date.now() }]
        };
        chat.messages.push(msgObj);
      } else if (!continueText) {
        // Adding a new alternative swipe
        msgObj.alternatives.push({ text: '', createdAt: Date.now() });
        msgObj.selectedIndex = msgObj.alternatives.length - 1;
      }

      const altIdx = msgObj.selectedIndex;
      updateChatInStorage(chat);
      await renderMainView();

      try {
        const finalReply = await API.generateReply({
          character: char,
          persona,
          messages: chat.messages,
          memory: chat.memory,
          authorsNote: chat.authorsNote,
          lorebookEntries: chat.lorebook,
          settings,
          signal: State.abortController.signal,
          continueFrom: continueText,
          onToken(chunk) {
            msgObj.alternatives[altIdx].text += chunk;
            const row = document.querySelector(`.msg-row[data-msg-id="${msgObj.id}"] .msg-text-body`);
            if (row) {
              row.innerHTML = formatRoleplayText(msgObj.alternatives[altIdx].text);
              scrollToChatBottom();
            }
          }
        });
        msgObj.alternatives[altIdx].text = finalReply;
        updateChatInStorage(chat);

        if (settings.showSuggestions) {
          State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          if (!msgObj.alternatives[altIdx].text) {
            msgObj.alternatives[altIdx].text = '*[Generation stopped by user]*';
          }
          updateChatInStorage(chat);
        } else {
          showToast('Generation failed: ' + (err.message || 'Unknown error'), 'error', () => {
            triggerAssistantGeneration({ chat, char, targetMessage: msgObj, continueText });
          });
        }
      } finally {
        State.isGenerating = false;
        State.abortController = null;
        await renderMainView();
      }
    }

    async function handleSendUserMessage(prefilledText = null) {
      if (State.isGenerating) return;
      const chat = getActiveChat();
      if (!chat) return;
      const char = await API.getCharacter(chat.characterId);
      if (!char) return;

      const inputEl = document.getElementById('chat-input');
      const rawText = prefilledText !== null ? prefilledText : (inputEl ? inputEl.value : '');
      const text = rawText.trim();
      if (!text) return;

      if (inputEl) inputEl.value = '';

      chat.messages.push({
        id: 'msg_' + Date.now(),
        role: 'user',
        selectedIndex: 0,
        alternatives: [{ text, createdAt: Date.now() }]
      });
      updateChatInStorage(chat);

      await triggerAssistantGeneration({ chat, char });
    }

    async function handleGenerateMessageImage(msgId = null) {
      const chat = getActiveChat();
      if (!chat) return;
      const char = await API.getCharacter(chat.characterId);
      const settings = Storage.getSettings();

      let targetMsg = msgId ? chat.messages.find(m => m.id === msgId) : null;
      const inputEl = document.getElementById('chat-input');
      const customPrompt = inputEl && inputEl.value.trim() ? inputEl.value.trim() : '';

      if (!targetMsg) {
        // Insert a new visual message bubble from character
        const promptText = customPrompt || `${char.name}, ${char.tagline}, cinematic scene`;
        if (inputEl && customPrompt) inputEl.value = '';
        targetMsg = {
          id: 'msg_' + Date.now(),
          role: 'char',
          selectedIndex: 0,
          alternatives: [{
            text: `*Visualizing scene: "${promptText}"*`,
            imagePrompt: promptText,
            imageLoading: true,
            createdAt: Date.now()
          }]
        };
        chat.messages.push(targetMsg);
      } else {
        const alt = targetMsg.alternatives[targetMsg.selectedIndex];
        alt.imagePrompt = alt.imagePrompt || alt.text.replace(/[*"]/g, '').slice(0, 90) || char.name;
        alt.imageLoading = true;
      }

      updateChatInStorage(chat);
      await renderMainView();

      try {
        const alt = targetMsg.alternatives[targetMsg.selectedIndex];
        const url = await API.generateImage({
          prompt: `${settings.imageGen.stylePrefix}, ${alt.imagePrompt}`,
          character: char,
          settings
        });
        alt.imageUrl = url;
        alt.imageLoading = false;
        updateChatInStorage(chat);
        await renderMainView();
      } catch (err) {
        const alt = targetMsg.alternatives[targetMsg.selectedIndex];
        alt.imageLoading = false;
        updateChatInStorage(chat);
        await renderMainView();
        showToast('Image generation failed.', 'error', () => handleGenerateMessageImage(targetMsg.id));
      }
    }

    function bindChatViewEvents() {
      const inputEl = document.getElementById('chat-input');
      if (inputEl) {
        inputEl.addEventListener('input', () => {
          inputEl.style.height = 'auto';
          inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
        });

        inputEl.addEventListener('keydown', (e) => {
          const isMobile = window.matchMedia('(max-width: 840px)').matches;
          if (e.key === 'Enter' && !e.shiftKey && !isMobile) {
            e.preventDefault();
            handleSendUserMessage();
          }
        });
      }

      // Context Drawer Auto-save (Memory, Author's Note, Lorebook)
      const memEl = document.getElementById('ctx-memory');
      const anEl = document.getElementById('ctx-authors-note');
      if (memEl) {
        memEl.addEventListener('input', () => {
          const chat = getActiveChat();
          if (chat) {
            chat.memory = memEl.value;
            updateChatInStorage(chat);
          }
        });
      }
      if (anEl) {
        anEl.addEventListener('input', () => {
          const chat = getActiveChat();
          if (chat) {
            chat.authorsNote = anEl.value;
            updateChatInStorage(chat);
          }
        });
      }

      document.querySelectorAll('.lorebook-entry-card').forEach(card => {
        const loreId = card.getAttribute('data-lore-id');
        const syncLore = () => {
          const chat = getActiveChat();
          if (!chat) return;
          const entry = (chat.lorebook || []).find(l => l.id === loreId);
          if (!entry) return;
          entry.name = card.querySelector('.lore-name-input').value;
          entry.enabled = card.querySelector('.lore-enabled-toggle').checked;
          entry.keywords = card.querySelector('.lore-keys-input').value.split(',').map(k => k.trim()).filter(Boolean);
          entry.text = card.querySelector('.lore-text-input').value;
          updateChatInStorage(chat);
        };
        card.querySelectorAll('input, textarea').forEach(el => {
          el.addEventListener('input', syncLore);
          el.addEventListener('change', syncLore);
        });
      });
    }

    function bindEditorEvents(draft) {
      const form = document.getElementById('char-editor-form');
      const nameIn = document.getElementById('ed-name');
      const tagIn = document.getElementById('ed-tagline');
      const tagsIn = document.getElementById('ed-tags');
      const avatarPreview = document.getElementById('editor-avatar-preview');
      const cardAvatar = document.getElementById('preview-card-avatar');
      const fileIn = document.getElementById('editor-avatar-file');
      const genBtn = document.getElementById('editor-gen-avatar-btn');

      const syncPreview = () => {
        document.getElementById('preview-card-name').textContent = nameIn.value.trim() || 'Unnamed Character';
        document.getElementById('preview-card-tagline').textContent = tagIn.value.trim() || 'Your character tagline will appear here...';
        const tags = tagsIn.value.split(',').map(t => t.trim()).filter(Boolean);
        document.getElementById('preview-card-tags').innerHTML = tags.slice(0, 3).map(t => `<span class="badge">${escapeHtml(t)}</span>`).join('');
      };

      [nameIn, tagIn, tagsIn].forEach(el => el.addEventListener('input', syncPreview));

      fileIn.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          draft.avatar = reader.result;
          avatarPreview.src = draft.avatar;
          cardAvatar.src = draft.avatar;
        };
        reader.readAsDataURL(file);
      });

      genBtn.addEventListener('click', async () => {
        genBtn.disabled = true;
        genBtn.textContent = 'Generating...';
        try {
          const uri = await API.generateAvatar({
            character: { name: nameIn.value || 'Character', description: document.getElementById('ed-description').value }
          });
          draft.avatar = uri;
          avatarPreview.src = uri;
          cardAvatar.src = uri;
          showToast('Generated new character portrait.', 'success');
        } finally {
          genBtn.disabled = false;
          genBtn.innerHTML = `${Icons.sparkles} Generate Avatar`;
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saved = await API.saveCharacter({
          ...draft,
          name: nameIn.value.trim(),
          tagline: tagIn.value.trim(),
          greeting: document.getElementById('ed-greeting').value.trim(),
          description: document.getElementById('ed-description').value.trim(),
          exampleDialogue: document.getElementById('ed-dialogue').value.trim(),
          tags: tagsIn.value.split(',').map(t => t.trim()).filter(Boolean),
          visibility: document.getElementById('ed-visibility').value
        });
        showToast(`Saved "${saved.name}".`, 'success');
        State.activeCharacterId = saved.id;
        State.screen = 'profile';
        renderMainView();
      });
    }

    function downloadJsonFile(filename, dataObj) {
      const blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function promptJsonImport(callback) {
      const fileInput = document.getElementById('global-file-input');
      fileInput.value = '';
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            callback(parsed);
          } catch (err) {
            showToast('Invalid JSON file: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      };
      fileInput.click();
    }

    /* Delegated Global Click Handler */
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) {
        if (State.chatMenuOpen && !e.target.closest('.chat-header-actions')) {
          State.chatMenuOpen = false;
          renderMainView();
        }
        return;
      }

      const action = btn.getAttribute('data-action');

      switch (action) {
        case 'nav': {
          State.screen = btn.getAttribute('data-screen');
          State.chatMenuOpen = false;
          renderMainView();
          break;
        }

        case 'toggle-theme': {
          const s = Storage.getSettings();
          s.theme = s.theme === 'dark' ? 'light' : 'dark';
          Storage.saveSettings(s);
          renderMainView();
          break;
        }

        case 'select-cat': {
          State.selectedCategory = btn.getAttribute('data-cat');
          renderMainView();
          break;
        }

        case 'clear-search': {
          State.searchQuery = '';
          renderMainView();
          break;
        }

        case 'view-profile': {
          e.stopPropagation();
          State.activeCharacterId = btn.getAttribute('data-char-id');
          State.chatMenuOpen = false;
          State.screen = 'profile';
          renderMainView();
          break;
        }

        case 'start-or-open-char': {
          if (e.target.closest('[data-action="view-profile"]')) return;
          const charId = btn.getAttribute('data-char-id');
          const existingChats = Storage.getChats().filter(c => c.characterId === charId).sort((a, b) => b.updatedAt - a.updatedAt);
          const char = await API.getCharacter(charId);
          if (!char) return;
          const chat = existingChats[0] || createNewChatForCharacter(char);
          State.activeCharacterId = char.id;
          State.activeChatId = chat.id;
          State.screen = 'chat';
          State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
          renderMainView();
          break;
        }

        case 'new-chat-for-char': {
          const charId = btn.getAttribute('data-char-id');
          const char = await API.getCharacter(charId);
          if (!char) return;
          const chat = createNewChatForCharacter(char);
          State.activeCharacterId = char.id;
          State.activeChatId = chat.id;
          State.chatMenuOpen = false;
          State.screen = 'chat';
          State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
          renderMainView();
          break;
        }

        case 'open-chat': {
          if (e.target.closest('[data-action="rename-chat"], [data-action="delete-chat"]')) return;
          const chatId = btn.getAttribute('data-chat-id');
          const charId = btn.getAttribute('data-char-id');
          State.activeChatId = chatId;
          State.activeCharacterId = charId;
          State.chatMenuOpen = false;
          State.screen = 'chat';
          const char = await API.getCharacter(charId);
          const chat = getActiveChat();
          if (char && chat) {
            State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
          }
          renderMainView();
          break;
        }

        case 'create-char': {
          State.editorCharacterId = null;
          State.screen = 'editor';
          renderMainView();
          break;
        }

        case 'edit-char': {
          const charId = btn.getAttribute('data-char-id');
          if (isSeedCharacter(charId)) {
            const char = await API.getCharacter(charId);
            if (!char) return;
            const copyName = char.name.includes('(Copy)') ? char.name : `${char.name} (Copy)`;
            const copy = await API.saveCharacter({
              ...char,
              id: '',
              name: copyName,
              creator: '@you',
              chatCount: 0
            });
            showToast(`Created editable copy "${copy.name}".`, 'success');
            State.editorCharacterId = copy.id;
            State.screen = 'editor';
            renderMainView();
            break;
          }
          State.editorCharacterId = charId;
          State.screen = 'editor';
          renderMainView();
          break;
        }

        case 'duplicate-char': {
          e.stopPropagation();
          const charId = btn.getAttribute('data-char-id');
          const char = await API.getCharacter(charId);
          if (!char) return;
          const copyName = char.name.includes('(Copy)') ? char.name : `${char.name} (Copy)`;
          const copy = await API.saveCharacter({
            ...char,
            id: '',
            name: copyName,
            creator: '@you',
            chatCount: 0
          });
          showToast(`Cloned as "${copy.name}". Opening editor...`, 'success');
          State.editorCharacterId = copy.id;
          State.screen = 'editor';
          renderMainView();
          break;
        }

        case 'delete-char': {
          const charId = btn.getAttribute('data-char-id');
          if (isSeedCharacter(charId)) {
            showToast('Default characters cannot be deleted.', 'warning');
            return;
          }
          const char = await API.getCharacter(charId);
          if (!char) return;
          showConfirmDialog({
            title: 'Delete Character?',
            message: `Permanently delete "${char.name}" and all associated chats? This cannot be undone.`,
            confirmLabel: 'Delete Character',
            onConfirm() {
              Storage.saveCharacters(Storage.getCharacters().filter(c => c.id !== charId));
              Storage.saveChats(Storage.getChats().filter(c => c.characterId !== charId));
              showToast(`Deleted "${char.name}".`, 'info');
              State.screen = 'discover';
              renderMainView();
            }
          });
          break;
        }

        case 'export-char': {
          const char = await API.getCharacter(btn.getAttribute('data-char-id'));
          if (char) {
            downloadJsonFile(`${char.name.toLowerCase().replace(/[^a-z0-9]+/g, '_')}_character.json`, char);
          }
          break;
        }

        case 'import-char-json': {
          promptJsonImport(async (data) => {
            if (!data.name) throw new Error('Character JSON missing "name" field.');
            const saved = await API.saveCharacter({ ...data, id: '' });
            showToast(`Imported character "${saved.name}".`, 'success');
            State.editorCharacterId = saved.id;
            renderMainView();
          });
          break;
        }

        case 'toggle-chat-menu': {
          e.stopPropagation();
          State.chatMenuOpen = !State.chatMenuOpen;
          renderMainView();
          break;
        }

        case 'toggle-context-drawer': {
          State.contextDrawerOpen = !State.contextDrawerOpen;
          renderMainView();
          break;
        }

        case 'char-chat-history': {
          State.historyFilterCharId = btn.getAttribute('data-char-id');
          State.chatMenuOpen = false;
          State.screen = 'history';
          renderMainView();
          break;
        }

        case 'clear-history-filter': {
          State.historyFilterCharId = null;
          renderMainView();
          break;
        }

        case 'send-message': {
          handleSendUserMessage();
          break;
        }

        case 'stop-generation': {
          if (State.abortController) {
            State.abortController.abort();
          }
          break;
        }

        case 'use-suggestion': {
          handleSendUserMessage(btn.getAttribute('data-text'));
          break;
        }

        case 'refresh-suggestions': {
          const chat = getActiveChat();
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (chat && char) {
            State.suggestedReplies = await API.suggestReplies({ character: char, messages: chat.messages });
            const s = Storage.getSettings();
            s.showSuggestions = true;
            Storage.saveSettings(s);
            renderMainView();
          }
          break;
        }

        case 'composer-gen-image': {
          handleGenerateMessageImage(null);
          break;
        }

        case 'msg-gen-image':
        case 'regen-msg-image': {
          handleGenerateMessageImage(btn.getAttribute('data-msg-id'));
          break;
        }

        case 'download-msg-image': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const alt = msg?.alternatives[msg.selectedIndex];
          if (alt?.imageUrl) {
            const a = document.createElement('a');
            a.href = alt.imageUrl;
            a.download = `scene_${msg.id}.svg`;
            a.click();
          }
          break;
        }

        case 'use-image-as-avatar': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const alt = msg?.alternatives[msg.selectedIndex];
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (alt?.imageUrl && char) {
            char.avatar = alt.imageUrl;
            await API.saveCharacter(char);
            showToast(`Updated ${char.name}'s avatar!`, 'success');
            renderMainView();
          }
          break;
        }

        case 'swipe-prev': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          if (msg && msg.selectedIndex > 0) {
            msg.selectedIndex--;
            updateChatInStorage(chat);
            renderMainView();
          }
          break;
        }

        case 'swipe-next': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          if (!chat || !msg) break;
          if (msg.selectedIndex < msg.alternatives.length - 1) {
            msg.selectedIndex++;
            updateChatInStorage(chat);
            renderMainView();
          } else {
            // Generate a new swipe alternative
            const char = await API.getCharacter(chat.characterId);
            if (char) await triggerAssistantGeneration({ chat, char, targetMessage: msg });
          }
          break;
        }

        case 'regen-msg': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (chat && msg && char) {
            await triggerAssistantGeneration({ chat, char, targetMessage: msg });
          }
          break;
        }

        case 'continue-msg': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (chat && msg && char) {
            const currentText = msg.alternatives[msg.selectedIndex]?.text || '';
            await triggerAssistantGeneration({ chat, char, targetMessage: msg, continueText: currentText });
          }
          break;
        }

        case 'copy-msg': {
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === btn.getAttribute('data-msg-id'));
          const text = msg?.alternatives[msg.selectedIndex]?.text || '';
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
          }
          showToast('Message copied to clipboard.', 'success');
          break;
        }

        case 'edit-msg': {
          State.editingMessageId = btn.getAttribute('data-msg-id');
          renderMainView();
          break;
        }

        case 'cancel-edit-msg': {
          State.editingMessageId = null;
          renderMainView();
          break;
        }

        case 'save-edit-msg': {
          const msgId = btn.getAttribute('data-msg-id');
          const chat = getActiveChat();
          const msg = chat?.messages.find(m => m.id === msgId);
          const textarea = document.querySelector(`.msg-row[data-msg-id="${msgId}"] .edit-msg-textarea`);
          if (chat && msg && textarea) {
            msg.alternatives[msg.selectedIndex].text = textarea.value;
            State.editingMessageId = null;
            updateChatInStorage(chat);
            renderMainView();
          }
          break;
        }

        case 'rewind-msg': {
          const msgId = btn.getAttribute('data-msg-id');
          const chat = getActiveChat();
          if (!chat) break;
          const idx = chat.messages.findIndex(m => m.id === msgId);
          if (idx < 0 || idx === chat.messages.length - 1) {
            showToast('Already at this point in the conversation.', 'info');
            break;
          }
          showConfirmDialog({
            title: 'Rewind Conversation?',
            message: `Delete ${chat.messages.length - 1 - idx} subsequent message(s) after this point?`,
            confirmLabel: 'Rewind Here',
            onConfirm() {
              chat.messages = chat.messages.slice(0, idx + 1);
              updateChatInStorage(chat);
              renderMainView();
            }
          });
          break;
        }

        case 'delete-msg': {
          const msgId = btn.getAttribute('data-msg-id');
          const chat = getActiveChat();
          if (!chat) break;
          showConfirmDialog({
            title: 'Delete Message?',
            message: 'Remove this message from the chat history?',
            confirmLabel: 'Delete',
            onConfirm() {
              chat.messages = chat.messages.filter(m => m.id !== msgId);
              updateChatInStorage(chat);
              renderMainView();
            }
          });
          break;
        }

        case 'clear-chat': {
          State.chatMenuOpen = false;
          const chat = getActiveChat();
          const char = chat ? await API.getCharacter(chat.characterId) : null;
          if (!chat || !char) break;
          showConfirmDialog({
            title: 'Clear Current Chat?',
            message: `Reset this conversation back to ${char.name}'s opening greeting?`,
            confirmLabel: 'Clear Chat',
            onConfirm() {
              chat.messages = [{
                id: 'msg_' + Date.now(),
                role: 'char',
                selectedIndex: 0,
                alternatives: [{ text: char.greeting, createdAt: Date.now() }]
              }];
              updateChatInStorage(chat);
              renderMainView();
            }
          });
          break;
        }

        case 'export-chat': {
          State.chatMenuOpen = false;
          const chat = getActiveChat();
          if (chat) {
            downloadJsonFile(`${chat.title.toLowerCase().replace(/[^a-z0-9]+/g, '_')}.json`, chat);
          }
          break;
        }

        case 'import-chat': {
          State.chatMenuOpen = false;
          promptJsonImport((data) => {
            if (!Array.isArray(data.messages)) throw new Error('Invalid chat JSON.');
            const current = getActiveChat();
            const imported = {
              ...data,
              id: 'chat_' + Date.now(),
              characterId: current ? current.characterId : data.characterId,
              updatedAt: Date.now()
            };
            updateChatInStorage(imported);
            State.activeChatId = imported.id;
            showToast('Imported chat session.', 'success');
            renderMainView();
          });
          break;
        }

        case 'add-lore-entry': {
          const chat = getActiveChat();
          if (!chat) break;
          chat.lorebook = chat.lorebook || [];
          chat.lorebook.unshift({
            id: 'lore_' + Date.now(),
            name: 'New Lore Entry',
            keywords: ['keyword'],
            text: '',
            enabled: true
          });
          updateChatInStorage(chat);
          renderMainView();
          break;
        }

        case 'delete-lore-entry': {
          const loreId = btn.getAttribute('data-lore-id');
          const chat = getActiveChat();
          if (!chat) break;
          chat.lorebook = (chat.lorebook || []).filter(l => l.id !== loreId);
          updateChatInStorage(chat);
          renderMainView();
          break;
        }

        case 'rename-chat': {
          e.stopPropagation();
          const chatId = btn.getAttribute('data-chat-id');
          const chats = Storage.getChats();
          const chat = chats.find(c => c.id === chatId);
          if (!chat) break;
          const nextTitle = prompt('Rename chat session:', chat.title);
          if (nextTitle && nextTitle.trim()) {
            chat.title = nextTitle.trim();
            Storage.saveChats(chats);
            renderMainView();
          }
          break;
        }

        case 'delete-chat': {
          e.stopPropagation();
          const chatId = btn.getAttribute('data-chat-id');
          showConfirmDialog({
            title: 'Delete Chat Session?',
            message: 'Permanently delete this conversation history?',
            confirmLabel: 'Delete',
            onConfirm() {
              Storage.saveChats(Storage.getChats().filter(c => c.id !== chatId));
              if (State.activeChatId === chatId) State.activeChatId = null;
              renderMainView();
            }
          });
          break;
        }

        case 'add-persona': {
          const personas = Storage.getPersonas();
          const next = {
            id: 'persona_' + Date.now(),
            name: 'New Persona',
            description: 'Describe your character appearance and demeanor...',
            avatar: makeSvgAvatar('NP', '#7c3aed', '#db2777')
          };
          personas.push(next);
          Storage.savePersonas(personas);
          Storage.setActivePersonaId(next.id);
          renderMainView();
          break;
        }

        case 'activate-persona': {
          Storage.setActivePersonaId(btn.getAttribute('data-persona-id'));
          showToast('Switched active persona.', 'success');
          renderMainView();
          break;
        }

        case 'save-persona': {
          const pId = btn.getAttribute('data-persona-id');
          const card = document.querySelector(`[data-persona-id="${pId}"]`);
          const personas = Storage.getPersonas();
          const p = personas.find(x => x.id === pId);
          if (card && p) {
            p.name = card.querySelector('.persona-name-input').value.trim() || 'Traveler';
            p.description = card.querySelector('.persona-desc-input').value.trim();
            Storage.savePersonas(personas);
            showToast(`Saved persona "${p.name}".`, 'success');
            renderMainView();
          }
          break;
        }

        case 'regen-persona-avatar': {
          const pId = btn.getAttribute('data-persona-id');
          const personas = Storage.getPersonas();
          const p = personas.find(x => x.id === pId);
          if (p) {
            p.avatar = await API.generateAvatar({ character: { name: p.name } });
            Storage.savePersonas(personas);
            renderMainView();
          }
          break;
        }

        case 'delete-persona': {
          const pId = btn.getAttribute('data-persona-id');
          showConfirmDialog({
            title: 'Delete Persona?',
            message: 'Remove this persona profile?',
            confirmLabel: 'Delete',
            onConfirm() {
              const remaining = Storage.getPersonas().filter(x => x.id !== pId);
              Storage.savePersonas(remaining);
              if (Storage.getActivePersonaId() === pId && remaining[0]) {
                Storage.setActivePersonaId(remaining[0].id);
              }
              renderMainView();
            }
          });
          break;
        }

        case 'export-all-data': {
          downloadJsonFile(`aetherweaver_backup_${new Date().toISOString().slice(0, 10)}.json`, Storage.exportAllData());
          showToast('Exported full backup JSON.', 'success');
          break;
        }

        case 'import-all-data': {
          promptJsonImport((payload) => {
            Storage.importAllData(payload);
            showToast('Backup restored!', 'success');
            renderMainView();
          });
          break;
        }

        case 'reset-demo-data': {
          showConfirmDialog({
            title: 'Reset All Data to Demo State?',
            message: 'This will erase all custom characters, chats, personas, and settings and restore the factory seed data.',
            confirmLabel: 'Reset Everything',
            onConfirm() {
              Storage.resetToDemo();
              State.activeChatId = null;
              State.activeCharacterId = null;
              State.screen = 'discover';
              showToast('Reset to factory demo data.', 'info');
              renderMainView();
            }
          });
          break;
        }
      }
    });

    /* Global Keyboard Shortcuts (Desktop) */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modalRoot = document.getElementById('modal-root');
        if (modalRoot && modalRoot.innerHTML !== '') {
          modalRoot.innerHTML = '';
          return;
        }
        if (State.isGenerating && State.abortController) {
          State.abortController.abort();
          return;
        }
        if (State.chatMenuOpen) {
          State.chatMenuOpen = false;
          renderMainView();
        }
      }

      // Press '/' on Discover screen to focus search
      if (e.key === '/' && State.screen === 'discover' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        const searchEl = document.getElementById('discover-search-input');
        if (searchEl) searchEl.focus();
      }
    });

    /**
     * ============================================================================
     * 8. INITIALIZATION & SERVICE WORKER REGISTRATION
     * ============================================================================
     */
    async function initApp() {
      // Ensure seed characters & personas are initialized in localStorage on first run
      Storage.getCharacters();
      Storage.getPersonas();
      Storage.getSettings();

      await renderMainView();

      if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Silent ignore if served from file:// or restricted preview iframe
        });
      }
    }

    initApp();
  </script>
</body>

</html>
